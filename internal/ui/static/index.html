        const sameRow = from[0].row === to[0].row;

        from.forEach(f => {
          dots += `<circle cx="${f.outAnchor.x}" cy="${f.outAnchor.y}" r="3" fill="#30363d"/>`;
          to.forEach(t => {
            if (sameRow) {
              const dx = Math.max(24, (t.inAnchor.x - f.outAnchor.x) / 2);
              paths += `<path d="M ${f.outAnchor.x} ${f.outAnchor.y} C ${f.outAnchor.x + dx} ${f.outAnchor.y}, ${t.inAnchor.x - dx} ${t.inAnchor.y}, ${t.inAnchor.x} ${t.inAnchor.y}" fill="none" stroke="#30363d" stroke-width="1.5"/>`;
            } else {
              // Wrap: out to the right, down through the gutter, back in from the left.
              const gutter = (f.outAnchor.y + t.inAnchor.y) / 2;
              const outX = Math.min(width - 6, f.outAnchor.x + 18);
              const inX = Math.max(6, t.inAnchor.x - 18);
              paths += `<path d="M ${f.outAnchor.x} ${f.outAnchor.y}
                                 L ${outX} ${f.outAnchor.y}
                                 Q ${outX + 8} ${f.outAnchor.y} ${outX + 8} ${gutter}
                                 L ${outX + 8} ${gutter}
                                 L ${inX - 8} ${gutter}
                                 Q ${inX - 8} ${t.inAnchor.y} ${inX} ${t.inAnchor.y}
                                 L ${t.inAnchor.x} ${t.inAnchor.y}"
                        fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3"/>`;
            }
          });
        });
      }
      groups.get(order[0])?.forEach(f => {
        dots += `<circle cx="${f.inAnchor.x}" cy="${f.inAnchor.y}" r="3" fill="#30363d"/>`;
      });
      groups.get(order[order.length - 1])?.forEach(l => {
        dots += `<circle cx="${l.outAnchor.x}" cy="${l.outAnchor.y}" r="3" fill="#30363d"/>`;
      });
      return `<svg width="${width}" height="${height}" class="absolute inset-0 pointer-events-none" aria-hidden="true">${paths}${dots}</svg>`;
    }

    function laneHTML(repo, def, phaseByKey, bullet, availWidth) {
      const cols = buildGraphLayout(def, phaseByKey, bullet);
      if (cols.length === 0) {
        return `<div class="text-[#8b949e] text-[11px]">No workflow definition for ${escapeHTML(repo)}.</div>`;
      }
      const { placed, width, height } = positionLayout(cols, availWidth || 900);

      const cards = placed.map(pl => pl.cell.type === 'node'
        ? nodeCardHTML(pl.cell.node, pl.cell.phase, { x: pl.x, y: pl.y })
        : groupBoxHTML(pl.cell, pl.x, pl.y, pl.w, pl.h)).join('');

      return `
        <section class="mb-5" aria-label="${escapeAttr(repo + ' workflow')}">
          <div class="flex items-center gap-1.5 mb-2 font-mono text-[11px] font-bold text-white">
            <i class="fa-solid fa-code-branch text-[#8b949e] text-[9px]" aria-hidden="true"></i>${escapeHTML(repo)}
          </div>
          <div class="relative rounded-lg border border-[#21262d] bg-[#0b0e14]" style="width:${width}px;height:${height}px;">
            ${edgesSVG(placed, width, height)}
            ${cards}
          </div>
        </section>`;
    }

    async function renderWorkflowGraph(run, phases) {
      const host = document.getElementById('workflow-graph');
      const list = phases || [];

      if (!run) {
        host.innerHTML = '<div class="text-[#8b949e] text-[11px]">Select or dispatch a run to draw its workflow.</div>';
        return;
      }

      // Repos come from the phases that ran; a run with none yet still draws its
      // configured repos so the operator sees what is about to happen.
      const repos = [...new Set(list.map(p => p.repo).filter(Boolean))];
      if (repos.length === 0) {
        host.innerHTML = `<div class="text-[#8b949e] text-[11px]">No phase data recorded for this run yet.</div>`;
        return;
      }

      const phaseByRepo = new Map();
      list.forEach(p => {
        if (!phaseByRepo.has(p.repo)) phaseByRepo.set(p.repo, new Map());
        phaseByRepo.get(p.repo).set((p.kind || '') + '\u0000' + p.name, p);
      });

      const bulletByRepo = await bulletsForRun(run.id);

      const lanes = [];
      for (const repo of repos) {
        const def = await workflowDefFor(run.project, repo);
        lanes.push(laneHTML(repo, def, phaseByRepo.get(repo) || new Map(), bulletByRepo.get(repo), host.clientWidth - 24));
      }
      host.innerHTML = lanes.join('');
      lastGraphRender = { run, phases: list };
    }

    // bulletsForRun answers repo -> bullet for the intent behind runId, so the
    // workflow graph's Delivery group can render each bullet's real lifecycle
    // position instead of always showing every stage as not-reached. A run
    // with no intent (predates intent tracking) or a fetch failure both
    // resolve to an empty map -- every lifecycle node then falls back to its
    // pre-existing not-reached rendering, not an error.
    async function bulletsForRun(runId) {
      const byRepo = new Map();
      try {
        const res = await fetch(`/api/bullets?run_id=${encodeURIComponent(runId)}`);
        if (!res.ok) return byRepo;
        const bullets = await res.json() || [];
        bullets.forEach(b => byRepo.set(b.repo, b));
      } catch (err) {
        console.error('Failed fetching bullets for run:', err);
      }
      return byRepo;
    }

    // Wrapping depends on the container width, so a resize has to re-lay-out.
    let lastGraphRender = null;
    let graphResizeTimer = null;
    window.addEventListener('resize', () => {
      if (!lastGraphRender) return;
      clearTimeout(graphResizeTimer);
      graphResizeTimer = setTimeout(() => {
        renderWorkflowGraph(lastGraphRender.run, lastGraphRender.phases);
      }, 120);
    });

    // drawerDeliveries holds the current run's delivery history (R5.6), fetched
    // alongside envelopes and rendered as a second section in the same
    // "activity" drawer — not a second drawer kind an operator has to know to
    // open separately (see design.md's rejected-alternatives note on the
    // Workers drawer for why).
    let drawerDeliveries = [];

    function activityDrawerBodyHTML() {
      return activityHTML(drawerActivity) + deliveriesHTML(drawerDeliveries);
    }

    function openActivityDrawer(opener) {
      const n = drawerActivity.length;
      openDrawer(`Activity (${n})`, 'activity', activityDrawerBodyHTML(), opener);
    }

    // Keeps an open activity drawer current. Called from both renderActivity and
    // renderDeliveries so whichever of the two arrives first still redraws a
    // consistent body instead of one section going stale until the other fetch
    // lands.
    function refreshActivityDrawer() {
      if (!drawerIsOpen() || document.getElementById('drawer-kind').textContent !== 'activity') return;
      document.getElementById('drawer-title').textContent = `Activity (${drawerActivity.length})`;
      document.getElementById('drawer-body').innerHTML = activityDrawerBodyHTML();
    }

    function renderActivity(envelopes) {
      drawerActivity = envelopes || [];
      const badge = document.getElementById('activity-count');
      badge.innerText = String(drawerActivity.length);
      refreshActivityDrawer();
    }

    // Fetches this run's delivery history (R5.6) alongside its envelopes. A
    // failed fetch renders no deliveries rather than leaving the previous run's
    // deliveries on screen under the new run's id.
    async function fetchDeliveryHistory(runId) {
      try {
        const res = await fetch(`/api/delivery-history?run_id=${encodeURIComponent(runId)}`);
        if (!res.ok) { renderDeliveries([]); return; }
        const data = await res.json();
        renderDeliveries(data || []);
      } catch (err) {
        console.error('Failed fetching delivery history:', err);
        renderDeliveries([]);
      }
    }

    function renderDeliveries(deliveries) {
      drawerDeliveries = deliveries || [];
      refreshActivityDrawer();
    }

    // Delivery state vocabulary, following the same shape as PHASE_LOOK.
    // dead_letter is styled like a failed phase (rose) so it reads as the one
    // state that needs operator action; quarantined reads as amber, a
    // deliberate operator decision rather than a failure.
    const DELIVERY_STATE_LOOK = {
      pending:      { cls: 'text-[#8b949e]', icon: 'fa-regular fa-clock',            label: 'Pending' },
      retrying:     { cls: 'text-amber-400', icon: 'fa-solid fa-rotate',             label: 'Retrying' },
      leased:       { cls: 'text-[#58a6ff]', icon: 'fa-solid fa-hourglass-half',     label: 'Leased' },
      delivered:    { cls: 'text-[#3fb950]', icon: 'fa-solid fa-circle-check',       label: 'Delivered' },
      acknowledged: { cls: 'text-[#3fb950]', icon: 'fa-solid fa-circle-check',       label: 'Acknowledged' },
      failed:       { cls: 'text-rose-400',  icon: 'fa-solid fa-circle-xmark',       label: 'Failed' },
      dead_letter:  { cls: 'text-rose-400',  icon: 'fa-solid fa-skull-crossbones',   label: 'Dead letter' },
      quarantined:  { cls: 'text-amber-300', icon: 'fa-solid fa-shield-halved',      label: 'Quarantined' },
    };

    function deliveryRowHTML(d) {
      const look = DELIVERY_STATE_LOOK[d.state] || { cls: 'text-[#8b949e]', icon: 'fa-regular fa-circle', label: d.state || '—' };
      const isDeadLetter = d.state === 'dead_letter';
      // A dead_letter row is visually distinct: a rose-tinted card, matching the
      // rose used for a failed phase elsewhere in this file, rather than the
      // neutral card every other delivery state uses.
      const cardCls = isDeadLetter
        ? 'p-2.5 rounded bg-rose-950/30 border border-rose-800/60 space-y-1.5'
        : 'p-2.5 rounded bg-[#161b22]/90 border border-[#30363d] space-y-1.5';

      const quarantineBtn = isDeadLetter
        ? `<button type="button" onclick="quarantineDelivery('${escapeAttr(d.envelope_id)}', '${escapeAttr(d.consumer)}')"
             class="px-2 py-0.5 rounded bg-rose-900 hover:bg-rose-800 text-white text-[10px] font-bold flex items-center gap-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-400">
             <i class="fa-solid fa-ban" aria-hidden="true"></i> Quarantine
           </button>`
        : '';

      const errorBlock = d.error
        ? `<div class="text-[10px] text-rose-400 break-all">${escapeHTML(d.error)}${d.error_class ? ` <span class="text-[#8b949e]">(${escapeHTML(d.error_class)})</span>` : ''}</div>`
        : '';
      const recoveryBlock = d.recovery_instructions
        ? `<div class="text-[10px] text-amber-200/90 break-all">${escapeHTML(d.recovery_instructions)}</div>`
        : '';

      return `
        <div class="${cardCls}">
          <div class="flex justify-between items-center text-[10px] gap-2">
            <span class="${look.cls} font-bold flex items-center gap-1.5 font-mono">
              <i class="${look.icon}" aria-hidden="true"></i> ${escapeHTML(look.label)}
            </span>
            <span class="text-[#8b949e] font-mono">${d.created_at ? escapeHTML(new Date(d.created_at).toLocaleTimeString()) : ''}</span>
          </div>
          <div class="text-slate-300 text-[10px] font-mono truncate" title="${escapeAttr(d.consumer || '')}">${escapeHTML(d.consumer || '—')}</div>
          <div class="flex justify-between items-center gap-2 text-[10px] text-[#8b949e]">
            <span>Attempt ${escapeHTML(d.attempt != null ? d.attempt : '—')}</span>
            ${quarantineBtn}
          </div>
          ${errorBlock}
          ${recoveryBlock}
        </div>`;
    }

    // Renders the run's delivery history as a section beneath its envelope
    // activity, following activityHTML's structure and Tailwind conventions.
    // Deliberately not a separate drawer kind — see the comment above
    // drawerDeliveries.
    function deliveriesHTML(deliveries) {
      const list = deliveries || [];
      const body = list.length === 0
        ? '<div class="text-[#8b949e]">No deliveries recorded for this run yet.</div>'
        : `<div class="space-y-1.5">${list.map(deliveryRowHTML).join('')}</div>`;
      return `
        <div class="pt-3 mt-3 border-t border-[#21262d] space-y-1.5">
          <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">Deliveries</div>
          ${body}
        </div>`;
    }

    // Quarantines a dead-lettered delivery. Replay is deliberately not offered
    // here (see proposal.md's out-of-scope section) — quarantine is the one
    // action this bullet exposes, because it only ever writes a record and
    // needs no reconstruction of which attempt closure originally ran.
    async function quarantineDelivery(envelopeId, consumer) {
      const reason = prompt('Reason for quarantining this delivery:');
      if (reason === null) return;
      const trimmed = reason.trim();
      if (!trimmed) {
        alert('A reason is required to quarantine a delivery.');
        return;
      }
      try {
        const res = await fetch('/api/delivery-quarantine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ envelope_id: envelopeId, consumer: consumer, reason: trimmed })
        });
        if (!res.ok) {
          alert('Quarantine failed: ' + await res.text());
          return;
        }
      } catch (err) {
        alert('Quarantine failed: ' + err);
        return;
      }
      if (activeRunId) fetchDeliveryHistory(activeRunId);
    }

    // Worktree leases, opened from the ambient "Workers" count in the status bar.
    // This was a top-level tab, which put a worktree table beside a run list it had no
    // relationship to. It is reference material, so it belongs in the drawer.
    let drawerLeases = [];

    function openWorkersDrawer(opener) {
      fetchFleet();
      openDrawer(`Workers & worktrees (${drawerLeases.length})`, 'workers', workersHTML(drawerLeases), opener);
    }

    function workersHTML(leases) {
      if (!leases || leases.length === 0) {
        return '<div class="text-[#8b949e]">No worktrees allocated.</div>';
      }
      return `
        <div class="flex items-center justify-between gap-2 mb-1">
          <span class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">Allocated worktrees</span>
          <button type="button" onclick="cleanActiveWorktrees()"
            class="px-2 py-0.5 rounded bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-slate-300 hover:text-white text-[10px] font-bold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
            Prune all
          </button>
        </div>
        <div class="space-y-1.5">
        ${leases.map(l => `
          <div class="p-2 rounded bg-[#161b22] border border-[#30363d] space-y-1">
            <div class="flex items-center justify-between gap-2">
              <span class="font-mono font-bold text-[#58a6ff] truncate">${escapeHTML(l.task_id)}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded border border-[#30363d] text-[#8b949e] font-mono shrink-0">${escapeHTML(l.status || '—')}</span>
            </div>
            <div class="font-mono text-[10px] text-slate-400 break-all" title="${escapeAttr(l.path || '')}">${escapeHTML(l.path || '—')}</div>
            <div class="flex items-center justify-between gap-2 text-[10px] text-[#8b949e]">
              <span>${escapeHTML(l.created_at ? relativeTime(l.created_at) : '—')}</span>
              <button type="button" onclick="cleanActiveWorktrees('${escapeAttr(l.task_id)}')"
                class="px-2 py-0.5 rounded bg-[#0b0e14] hover:bg-[#21262d] border border-[#30363d] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">Prune</button>
            </div>
          </div>`).join('')}
        </div>`;
    }

    // ---- Work analytics drawer ------------------------------------------------
    // A read-only aggregate over complete recorded history (not the 50-row
    // "recent activity" window /api/runs uses), following the same
    // fetch-then-openDrawer shape as openWorkersDrawer. analyticsHTML and
    // analyticsBreakdownHTML are pure (data in, HTML string out) so they are
    // unit-tested by executing them under real node, the same approach
    // stage_matrix_test.go/phase_detail_test.go use for laneHTML/phaseDetailHTML.

    // analyticsBreakdownHTML renders one labeled breakdown (outcome, work type,
    // agent, model, or provider) as counts and percentages, sorted by count
    // descending. The "" key — the explicit bucket for pre-O2 work types and
    // unknown provenance — is relabeled via emptyLabel rather than shown as a
    // blank line.
    function analyticsBreakdownHTML(title, counts, total, emptyLabel) {
      const entries = Object.keys(counts || {}).sort((a, b) => {
        const diff = (counts[b] || 0) - (counts[a] || 0);
        return diff !== 0 ? diff : a.localeCompare(b);
      });
      if (entries.length === 0) {
        return `
          <div class="space-y-1">
            <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">${escapeHTML(title)}</div>
            <div class="text-[#8b949e]">No data recorded yet.</div>
          </div>`;
      }
      const rows = entries.map(key => {
        const count = counts[key] || 0;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        const label = key === '' ? emptyLabel : key;
        return `
          <div class="flex items-center justify-between gap-2 text-[10px]">
            <span class="text-slate-300 truncate">${escapeHTML(label)}</span>
            <span class="text-[#8b949e] font-mono shrink-0">${count} (${pct}%)</span>
          </div>`;
      }).join('');
      return `
        <div class="space-y-1">
          <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">${escapeHTML(title)}</div>
          <div class="space-y-0.5">${rows}</div>
        </div>`;
    }

    // analyticsHTML is the drawer body for GET /api/analytics's response. Bullets
    // shipped shows "no bullets recorded yet" instead of a bulletsMerged/0 divide
    // (NaN%) when bullets_total is 0.
    function analyticsHTML(data) {
      const d = data || {};
      const totalRuns = d.total_runs || 0;
      const bulletsTotal = d.bullets_total || 0;
      const bulletsMerged = d.bullets_merged || 0;

      const bulletsSection = bulletsTotal === 0
        ? `<div class="space-y-1">
            <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">Bullets shipped</div>
            <div class="text-[#8b949e]">No bullets recorded yet.</div>
          </div>`
        : `<div class="space-y-1">
            <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">Bullets shipped</div>
            <div class="flex items-center justify-between gap-2 text-[10px]">
              <span class="text-slate-300">Merged</span>
              <span class="text-[#8b949e] font-mono">${bulletsMerged} / ${bulletsTotal} (${Math.round((bulletsMerged / bulletsTotal) * 100)}%)</span>
            </div>
          </div>`;

      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">Total runs</span>
            <span class="text-white font-mono font-bold">${totalRuns}</span>
          </div>
          ${analyticsBreakdownHTML('Outcome', d.by_status, totalRuns, '')}
          ${analyticsBreakdownHTML('Work type', d.by_type, totalRuns, 'before work types were tracked')}
          ${analyticsBreakdownHTML('Agent', d.by_agent, totalRuns, 'unknown')}
          ${analyticsBreakdownHTML('Model', d.by_model, totalRuns, 'unknown')}
          ${analyticsBreakdownHTML('Provider', d.by_provider, totalRuns, 'unknown')}
          ${bulletsSection}
        </div>`;
    }

    // openAnalyticsDrawer reads the project filter's current value
    // (selectedProject, set by onProjectChange) rather than a second,
    // independent notion of "current project" — the same value onProjectChange
    // already sets for fetchRuns.
    async function openAnalyticsDrawer(opener) {
      try {
        const res = await fetch(`/api/analytics?project=${encodeURIComponent(selectedProject)}`);
        const data = await res.json();
        openDrawer('Work analytics', 'analytics', analyticsHTML(data), opener);
      } catch (err) {
        alert("Failed loading work analytics: " + err);
      }
    }

    function activityHTML(envelopes) {
      if (!envelopes || envelopes.length === 0) {
        return '<div class="text-[#8b949e]">No activity recorded for this run yet.</div>';
      }
      return envelopes.map(e => {
        let isPR = e.stage === 'review' || (e.summary && e.summary.toLowerCase().includes('pr'));
        let artifactsHTML = '';
        
        if (e.artifacts && e.artifacts.length) {
          artifactsHTML = e.artifacts.map(a => {
            const isURL = a.startsWith('http://') || a.startsWith('https://');
            if (isURL) {
              return `
                <div class="flex items-center space-x-1.5 mt-1">
                  <a href="${a}" target="_blank" rel="noopener noreferrer" class="px-2 py-1 rounded bg-[#1f6feb] hover:bg-[#388bfd] text-white font-bold text-[10px] flex items-center gap-1 transition shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
                    <i class="fa-brands fa-github text-[11px]" aria-hidden="true"></i> Launch PR <i class="fa-solid fa-arrow-up-right-from-square text-[9px]" aria-hidden="true"></i>
                  </a>
                  <button onclick="copyToClipboard('${a}', this)" class="px-2 py-1 rounded bg-[#161b22] hover:bg-[#21262d] text-slate-300 hover:text-white border border-[#30363d] text-[10px] font-bold transition flex items-center gap-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
                    <i class="fa-regular fa-copy" aria-hidden="true"></i> Copy URL
                  </button>
                  <span class="text-slate-400 font-mono text-[10px] truncate max-w-sm ml-1" title="${a}">${a}</span>
                </div>
              `;
            } else {
              return `
                <span class="px-1.5 py-0.5 rounded bg-[#0b0e14] border border-[#30363d] text-teal-300 font-mono text-[10px] flex items-center gap-1">
                  <i class="fa-regular fa-file-code" aria-hidden="true"></i> ${a}
                </span>
              `;
            }
          }).join('');
        }

        return `
          <div class="p-2.5 rounded bg-[#161b22]/90 border border-[#30363d] space-y-1.5 transition hover:border-[#58a6ff]">
            <div class="flex justify-between items-center text-[10px]">
              <span class="font-bold text-[#58a6ff] flex items-center gap-1.5 font-mono">
                <i class="fa-solid ${isPR ? 'fa-code-pull-request text-emerald-400' : 'fa-box-open text-[#58a6ff]'}" aria-hidden="true"></i>
                ${escapeHTML(e.repo)} / ${escapeHTML(e.stage)}
              </span>
              <span class="text-[#8b949e] font-mono">${new Date(e.created_at).toLocaleTimeString()}</span>
            </div>
            <div class="text-white text-xs font-medium">${escapeHTML(e.summary)}</div>
            ${artifactsHTML ? `<div class="space-y-1 pt-1">${artifactsHTML}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    window.addEventListener('keydown', (e) => {
      // Prune is the only remaining dialog. Dispatching and project configuration were
      // removed from the frontend: dispatch is an API and agent concern, and project
      // YAML is edited in a text editor.
      const pruneModal = document.getElementById('prune-modal');
      const openModal = [pruneModal].find(m => m && !m.classList.contains('hidden'));

      if (e.key === 'Escape' && !openModal && drawerIsOpen()) {
        closeDrawer();
        return;
      }

      if (e.key === 'Escape' && openModal) {
        if (openModal === pruneModal) closePruneModal();
        return;
      }

      if (e.key === 'Tab' && openModal) {
        const focusableSelector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
        const focusableElements = Array.from(openModal.querySelectorAll(focusableSelector)).filter(el => el.offsetParent !== null);
        
        if (focusableElements.length === 0) return;

        const firstElement = focusableElements[0];
        const lastElement = focusableElements[focusableElements.length - 1];

        if (e.shiftKey) {
          if (document.activeElement === firstElement || !openModal.contains(document.activeElement)) {
            e.preventDefault();
            lastElement.focus();
          }
        } else {
          if (document.activeElement === lastElement || !openModal.contains(document.activeElement)) {
            e.preventDefault();
            firstElement.focus();
          }
        }
      }
    });

    // ---- The sequenced state stream ------------------------------------------
    //
    // This replaces a 2000ms polling interval that re-read the entire run list
    // thirty times a minute, per connected browser, forever — whether or not
    // anything had changed. There was no sequence number and no replay, so a
    // browser that missed an update could not ask for what it missed; it could
    // only wait for the next tick. Decision D10 adopts AHP's subscribe/snapshot/
    // replay model instead: the server tells us when something moved, and tells
    // us where we are so a reconnect resumes rather than restarts.
    //
    // The render path below is unchanged. A change event says *that* state moved;
    // the existing key-diff in renderRunList still decides what to redraw, which
    // is why scroll position and focus survive an update.

    // The sequence of the last change applied. A reconnect resumes from it.
    let lastSeq = 0;
    let stream = null;
    let refreshTimer = null;

    // Coalesce refreshes. A run recording twenty phases in one burst would
    // otherwise trigger twenty full re-reads at once — the cost the polling loop
    // had, moved to a worse place. One short timer collapses the burst into a
    // single read. Nothing is armed while the stream is idle, so an idle
    // dashboard issues no requests at all.
    function scheduleRefresh() {
      if (refreshTimer !== null) return;
      refreshTimer = setTimeout(() => {
        refreshTimer = null;
        fetchRuns();
        fetchFleet();
      }, 80);
    }

    // A snapshot is the server saying "you are not where you think you are, here
    // is the current sequence". Adopt it and re-read; the sequence is what makes
    // the next reconnect resumable.
    function onStreamSnapshot(ev) {
      let data = {};
      try { data = JSON.parse(ev.data) || {}; } catch (err) { data = {}; }
      lastSeq = typeof data.seq === 'number' ? data.seq : 0;
      setConnectionError(false);
      scheduleRefresh();
    }

    // ---- Reported checklist progress ----------------------------------------
    //
    // Progress is received on ChannelProgress change events, keyed by run id.
    // The most recent snapshot per run is kept; items are per-repo but the
    // dashboard shows one plan per run (the first repo that reports one).
    //
    // Truthfulness rules:
    //   - A nil/absent plan renders "no progress reported", never zero.
    //   - Progress never changes the run's status badge; it sits beside it.
    //   - A fully-reported plan with a failing gate still renders as FAILED.
    //
    // progressByRun itself is declared once, near the other top-level state
    // (above) — a second `const progressByRun` was declared here too, which
    // is a SyntaxError on redeclaration and silently failed the entire
    // script's parse, breaking every dynamic part of this dashboard
    // (project list, run list, everything) with no visible error short of
    // opening the browser console.

    // renderProgressPanel redraws the progress panel for the currently active run.
    function renderProgressPanel() {
      const panel   = document.getElementById('progress-panel');
      const content = document.getElementById('progress-content');
      if (!panel || !content) return;

      if (!activeRunId) {
        panel.classList.add('hidden');
        return;
      }

      const prog = progressByRun.get(activeRunId);
      if (!prog) {
        // No progress event received yet — hide the panel entirely.
        // "No progress reported" is conveyed by the panel being absent, not
        // by showing a zero-count row.
        panel.classList.add('hidden');
        return;
      }

      panel.classList.remove('hidden');

      const { complete, total, items } = prog;

      // Build markers: one per item.
      let markers = '';
      (items || []).forEach(item => {
        const s = item.status || 'pending';
        if (s === 'complete') {
          markers += `<span title="${escapeAttr(item.scenario || '')}" aria-label="complete: ${escapeAttr(item.scenario || '')}" class="text-[#3fb950] text-[11px]"><i class="fa-solid fa-circle" aria-hidden="true"></i></span>`;
        } else if (s === 'in_progress') {
          markers += `<span title="${escapeAttr(item.scenario || '')}" aria-label="in progress: ${escapeAttr(item.scenario || '')}" class="text-amber-400 text-[11px]"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i></span>`;
        } else {
          markers += `<span title="${escapeAttr(item.scenario || '')}" aria-label="pending: ${escapeAttr(item.scenario || '')}" class="text-[#6e7681] text-[11px]"><i class="fa-regular fa-circle" aria-hidden="true"></i></span>`;
        }
      });

      // Count label beneath markers.
      const countLabel = `<span class="text-[10px] font-mono text-[#8b949e] shrink-0">${complete}/${total} reported</span>`;

      // A zero-item plan means the change declared no scenarios.
      const markersBlock = total === 0
        ? `<span class="text-[10px] text-[#8b949e] italic">no scenarios declared</span>`
        : `<span class="flex items-center gap-0.5 flex-wrap">${markers}</span>`;

      content.innerHTML =
        `<span class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider shrink-0">Reported</span>` +
        markersBlock +
        countLabel;
    }

    // A change carries its own sequence number. Advancing lastSeq only forwards
    // means an out-of-order or replayed event cannot move the cursor backwards and
    // cause the same range to be requested again on reconnect.
    function onStreamChange(ev) {
      let data = {};
      try { data = JSON.parse(ev.data) || {}; } catch (err) { data = {}; }
      if (typeof data.seq === 'number' && data.seq > lastSeq) lastSeq = data.seq;
      setConnectionError(false);

      // Handle a progress change inline — no re-fetch needed. The change record
      // shape is {seq, channel, entity_id, payload, created_at}. The payload
      // field is the progress data object.
      if (data.channel === 'progress') {
        let prog = {};
        try { prog = (typeof data.payload === 'string' ? JSON.parse(data.payload) : data.payload) || {}; } catch (e) {}
        const runId = prog.run_id || data.entity_id;
        if (runId) {
          progressByRun.set(runId, {
            complete: typeof prog.complete === 'number' ? prog.complete : 0,
            total:    typeof prog.total    === 'number' ? prog.total    : 0,
            items:    Array.isArray(prog.items) ? prog.items : [],
          });
          if (runId === activeRunId) renderProgressPanel();
        }
      }

      scheduleRefresh();
    }

    // Subscribe from the last sequence applied. With nothing applied yet we send
    // no cursor at all, which asks the server for a snapshot: the log holds
    // transitions, so replaying it from zero would not describe a run that was
    // recorded before the log existed.
    //
    // There is no reconnect logic here on purpose. EventSource reconnects by
    // itself and sends Last-Event-ID, which the server prefers over the query
    // string, so a reconnect resumes from the last event actually delivered.
    function subscribeToStream() {
      if (stream) stream.close();
      const url = lastSeq > 0
        ? `/api/stream?from=${encodeURIComponent(lastSeq)}`
        : '/api/stream';
      stream = new EventSource(url);
      stream.addEventListener('snapshot', onStreamSnapshot);
      stream.addEventListener('change', onStreamChange);
      stream.addEventListener('open', () => setConnectionError(false));
      stream.addEventListener('error', () => setConnectionError(true));
      return stream;
    }

    loadProjects();
    // One read to draw something before the first snapshot arrives. Everything
    // after this is driven by the stream.
    fetchRuns();
    fetchFleet();
    subscribeToStream();
  </script>
</body>
</html>

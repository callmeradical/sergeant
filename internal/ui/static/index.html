<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sergeant — Software Factory Spine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/xterm.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-[#0b0e14] text-[#c9d1d9] h-screen overflow-hidden flex flex-col antialiased selection:bg-emerald-500/30 text-xs">

  <!-- Network / Poll Failure Banner -->
  <div id="connection-error-banner" class="hidden bg-rose-950 text-rose-300 px-3 py-1.5 text-[11px] font-bold border-b border-rose-800 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-rose-400" aria-hidden="true"></i>
      <span>Connection to Sergeant daemon lost. Retrying...</span>
    </div>
    <button onclick="fetchRuns(); fetchFleet();" class="px-2 py-0.5 rounded bg-rose-900 hover:bg-rose-800 text-white text-[10px]">Retry Now</button>
  </div>

  <!-- Top Bar: Clean Unified Header -->
  <header class="h-11 border-b border-[#21262d] bg-[#0b0e14] px-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-4">
      <span class="font-extrabold text-xs tracking-wider text-white">Sergeant</span>
      
      <div class="h-3.5 w-px bg-[#21262d]"></div>

      <!-- Unified Project Scope Dropdown -->
      <div class="hidden md:flex items-center space-x-1.5 bg-[#161b22] px-2 py-0.5 rounded border border-[#30363d]">
        <span class="w-1.5 h-1.5 rounded-full bg-[#3fb950]" aria-hidden="true"></span>
        <label for="project-filter" class="text-[10px] text-[#8b949e] font-bold">Project:</label>
        <select id="project-filter" onchange="onProjectChange()" class="bg-transparent text-white font-bold text-xs focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff] focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0e14] cursor-pointer">
          <option value="all">Global (All projects)</option>
        </select>
      </div>


    </div>

    <!-- Dispatch Stage CTA & Global Actions -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-2 text-[#8b949e] text-xs">
        <button onclick="fetchRuns(); fetchFleet();" aria-label="Refresh state" title="Refresh state" class="min-w-[44px] min-h-[44px] flex items-center justify-center hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff] focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0e14] rounded"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
    </div>
  </header>

  <!-- Main Viewport Layout -->
  <div id="main-layout-wrapper" class="flex-1 flex overflow-hidden min-h-0">

    <!-- Left Vertical Rail: Navigation & Live Runs List -->
    <!-- Master pane for the Pipeline view only. It lists pipeline runs, which have
         nothing to do with the Workers table or the Repair diagnostics, so it is
         scoped to its owning tab rather than persisting as shell chrome. -->
    <aside id="master-rail" aria-label="Pipeline runs" class="hidden lg:flex w-72 bg-[#0b0e14] border-r border-[#21262d] flex-col p-2 gap-2 shrink-0 overflow-hidden min-h-0">
      <!-- Filter. The list is capped at 50 server-side and already holds 23, so finding
           a run by eye stops working well before the cap. Matches on slug, brief,
           project and status, because those are the four things shown on a card. -->
      <div class="shrink-0 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-2 top-1/2 -translate-y-1/2 text-[9px] text-[#8b949e]" aria-hidden="true"></i>
        <input type="search" id="run-filter" placeholder="Filter runs" aria-label="Filter runs"
          oninput="onRunFilterInput()"
          class="w-full bg-[#161b22] border border-[#30363d] rounded pl-6 pr-7 py-1 text-[11px] text-white placeholder-[#8b949e] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
        <button type="button" id="run-filter-clear" onclick="clearRunFilter()" aria-label="Clear filter"
          class="hidden absolute right-1 top-1/2 -translate-y-1/2 min-w-[20px] min-h-[20px] flex items-center justify-center rounded text-[#8b949e] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
          <i class="fa-solid fa-xmark text-[9px]" aria-hidden="true"></i>
        </button>
      </div>

      <div class="flex-1 flex flex-col overflow-hidden min-h-0">
        <div class="flex justify-between items-center px-1 pb-1.5 shrink-0">
          <span class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">Pipeline runs</span>
          <span id="sidebar-runs-count" class="text-[9px] text-[#8b949e] font-mono">0</span>
        </div>
        <div id="sidebar-runs-list" class="flex-1 overflow-y-auto space-y-1 pr-1 min-h-0" aria-live="polite">
          <div class="p-2 text-center text-[#8b949e] text-[10px]">No runs recorded.</div>
        </div>
      </div>
    </aside>

    <!-- Center Main Body Canvas -->
    <main class="flex-1 flex flex-col overflow-hidden bg-[#0b0e14] min-h-0">

      <!-- View 1: Stages Grid Matrix -->
      <div id="stitch-view-stages" class="flex-1 flex flex-col overflow-hidden p-4 space-y-4 min-h-0">
        
        <!-- Header Banner & System Status -->
        <div class="flex flex-wrap gap-2 justify-between items-start pb-2 shrink-0">
          <div class="min-w-0">
            <!-- The run identifies this view, so the run is the heading. "Pipeline" was
                 static text that already appears on the active tab, and "Pipeline for X"
                 repeated the word a third time. -->
            <h1 id="stage-run-badge" class="text-base font-bold text-white font-mono tracking-tight truncate">No run selected</h1>
            <p class="text-[11px] text-[#8b949e] mt-0.5 flex items-center gap-1.5 flex-wrap">
              <span id="active-matrix-project" class="text-teal-300 font-mono font-bold">None</span>
              <span id="active-run-meta" class="text-[#8b949e]"></span>
            </p>
            <div id="active-run-brief" class="text-[11px] text-slate-200 mt-1 max-w-3xl leading-relaxed whitespace-pre-wrap"></div>
            <button type="button" id="active-run-brief-toggle" onclick="toggleRunBriefExpanded()" hidden
              class="text-[10px] font-bold text-[#58a6ff] hover:text-[#79c0ff] mt-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff] rounded">Show more</button>
          </div>
          <div class="flex items-center space-x-2">
            <span id="system-status-pill" aria-live="polite" aria-atomic="true" class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#161b22] text-slate-300 border border-[#30363d]">
              No active run
            </span>
            <!-- The run's own detail, including resume. Resume is offered here and
                 not on a run card: a card is a navigation target, and a
                 state-changing action there is one stray click from a scan
                 gesture. -->
            <button type="button" id="btn-open-run-detail" onclick="openRunDrawer(this)"
              class="px-2 py-1 rounded bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-[10px] font-bold text-slate-300 hover:text-white flex items-center gap-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff] focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0e14]">
              <i class="fa-solid fa-circle-info text-[10px]" aria-hidden="true"></i>
              Run detail
            </button>
            <button type="button" id="btn-open-activity" onclick="openActivityDrawer(this)"
              class="px-2 py-1 rounded bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-[10px] font-bold text-slate-300 hover:text-white flex items-center gap-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff] focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0e14]">
              <i class="fa-regular fa-rectangle-list text-[10px]" aria-hidden="true"></i>
              Activity <span id="activity-count" class="font-mono text-[#8b949e]">0</span>
            </button>
            <button id="btn-stop-run" onclick="cancelActiveRun()" aria-label="Stop run" title="Stop run"
              class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded text-[#8b949e] hover:text-rose-400 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff] focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0e14]">
              <i class="fa-regular fa-circle-stop text-sm" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- Reported checklist progress. Populated from .sergeant/plan.json via
             the ChannelProgress change stream. Shows one marker per item:
             solid circle = complete, open circle = pending, spinner = in-progress.
             "No progress reported" (not zero) when the plan is absent. Never
             replaces the phase status pill — runs alongside it. -->
        <div id="progress-panel" class="hidden border border-[#21262d] rounded bg-[#0b0e14] px-3 py-2">
          <div id="progress-content" class="flex items-center gap-3 flex-wrap">
          </div>
        </div>

        <!-- Workflow graph. Nodes come from the workflow DEFINITION (/api/workflow),
             so a stage that has not started is still drawn, greyed. Live status is
             overlaid from phase records. This replaced a table whose cells happened to
             be buttons: a table cannot draw edges, and an invisible affordance is not
             an affordance. -->
        <div id="workflow-graph" class="flex-1 border border-[#21262d] rounded bg-[#0b0e14] overflow-auto min-h-0 p-3">
          <div class="text-[#8b949e] text-[11px]">Select or dispatch a run to draw its workflow.</div>
        </div>

      </div>

    </main>

  </div>

  <!-- Ambient status bar.
       These four values were crowded into the 44px header, which the design review
       flagged as carrying nine ungrouped elements. Decision D5 says only three events
       deserve a human's attention and everything else is ambient fleet state, so this
       is where ambient state belongs: glanceable, out of the reading path, never
       shouting. No pulse, no emoji, no unconditional reassurance. -->
  <footer class="shrink-0 h-6 border-t border-[#21262d] bg-[#0b0e14] px-3 flex items-center justify-between text-[10px] text-[#8b949e] font-mono">
    <div class="flex items-center gap-3 min-w-0">
      <!-- Embedded terminal (proposal.md): a real, Go-spawned shell PTY per
           session, unrecorded and unattributed to any intent/bullet/phase.
           Opens the bottom drawer; a fresh click with no sessions open starts
           the first one instead of toggling an empty drawer. Far-left of the
           status bar and filled rather than the neutral pattern every other
           footer button uses — the one primary action down here, VS Code/
           launchpad-style, not just another ambient item. -->
      <button type="button" id="btn-open-terminal" onclick="termSessions.size ? toggleTerminalDrawer() : startTerminalSession()"
        class="truncate flex items-center gap-1 rounded-sm px-1.5 -my-px py-px bg-[#1f6feb] hover:bg-[#388bfd] text-white font-bold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
        <i class="fa-solid fa-terminal text-[9px]" aria-hidden="true"></i> Terminal
      </button>
      <button type="button" id="btn-open-workers" onclick="openWorkersDrawer(this)"
        class="truncate rounded px-1 -mx-1 hover:text-white hover:bg-[#161b22] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
        Workers <span id="stat-workers-active" class="text-slate-300 font-bold">0</span>
      </button>
      <button type="button" id="btn-open-analytics" onclick="openAnalyticsDrawer(this)"
        class="truncate rounded px-1 -mx-1 hover:text-white hover:bg-[#161b22] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
        Work analytics
      </button>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <span id="last-updated">&mdash;</span>
    </div>
  </footer>

  <!-- Detail drawer.
       Non-modal by design: you read a phase log while looking at the pipeline, so this
       must NOT trap focus or set aria-modal the way the three dialogs do. It overlays
       rather than pushes, so the node you clicked does not move while you read it. -->
  <aside id="detail-drawer" role="complementary" aria-labelledby="drawer-title" aria-hidden="true" inert
    class="fixed top-11 right-0 bottom-6 w-full sm:w-[30rem] bg-[#0b0e14] border-l border-[#30363d] shadow-2xl z-40 flex flex-col translate-x-full transition-transform duration-150 ease-out motion-reduce:transition-none">
    <div class="h-9 shrink-0 bg-[#161b22] border-b border-[#21262d] px-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span id="drawer-kind" class="px-1.5 py-0.5 rounded bg-[#0b0e14] border border-[#30363d] text-[9px] font-mono text-[#8b949e] shrink-0">&mdash;</span>
        <h2 id="drawer-title" class="text-[11px] font-bold text-white truncate">Detail</h2>
      </div>
      <button id="drawer-close" onclick="closeDrawer()" aria-label="Close detail" title="Close detail"
        class="min-w-[32px] min-h-[32px] flex items-center justify-center rounded text-[#8b949e] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div id="drawer-body" class="flex-1 overflow-y-auto min-h-0 p-3 space-y-3 text-[11px]"></div>
  </aside>

  <!-- Terminal drawer.
       Modeled on launchpad's PTY-backed terminal (proposal.md): a real shell
       process per session, not a log or simulated output. Slides up from the
       bottom rather than overlaying from the right like detail-drawer, since
       this is a workspace the operator types into, not a read-only panel —
       and unlike detail-drawer, closing it does not end the sessions inside;
       only an explicit kill (per-tab close, or /api/terminal-kill) does. -->
  <aside id="terminal-drawer" aria-label="Terminal" aria-hidden="true" inert
    class="fixed left-0 right-0 bottom-0 h-[55vh] bg-[#0b0e14] border-t border-[#30363d] shadow-2xl z-40 flex flex-col translate-y-full transition-transform duration-150 ease-out motion-reduce:transition-none">
    <div class="h-9 shrink-0 bg-[#161b22] border-b border-[#21262d] px-2 flex items-center justify-between gap-2">
      <div id="terminal-tabs" class="flex-1 flex items-end gap-1 overflow-x-auto min-h-0" role="tablist" aria-label="Open terminal sessions"></div>
      <div class="flex items-center gap-1 shrink-0">
        <button type="button" onclick="startTerminalSession()" aria-label="New terminal" title="New terminal"
          class="min-w-[28px] min-h-[28px] flex items-center justify-center rounded text-[#8b949e] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
          <i class="fa-solid fa-plus text-[10px]" aria-hidden="true"></i>
        </button>
        <button type="button" id="terminal-drawer-close" onclick="closeTerminalDrawer()" aria-label="Hide terminal drawer" title="Hide terminal drawer (sessions stay running)"
          class="min-w-[28px] min-h-[28px] flex items-center justify-center rounded text-[#8b949e] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div id="terminal-panes" class="relative flex-1 min-h-0"></div>
  </aside>

  <!-- Prune Preview Confirmation Modal -->
  <div id="prune-modal" role="dialog" aria-modal="true" aria-labelledby="prune-modal-title" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#161b22] border border-[#30363d] rounded-lg max-w-lg w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-[#21262d]">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-broom text-amber-400" aria-hidden="true"></i>
          <h3 id="prune-modal-title" class="font-bold text-sm text-white">Confirm worktree cleanup</h3>
        </div>
        <button onclick="closePruneModal()" aria-label="Close dialog" class="min-w-[32px] min-h-[32px] flex items-center justify-center text-[#8b949e] hover:text-white rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <p class="text-slate-300">The following <span id="prune-count" class="font-bold text-white font-mono">0</span> worktree directories will be deleted:</p>
        <div id="prune-paths-list" class="max-h-40 overflow-y-auto p-2.5 rounded bg-[#0b0e14] border border-[#30363d] font-mono text-[10px] space-y-1 text-rose-300">
        </div>
        <div id="prune-skipped-container" class="hidden space-y-1">
          <p class="text-amber-400 font-bold text-[10px]">Skipped (in progress):</p>
          <div id="prune-skipped-list" class="max-h-24 overflow-y-auto p-2 rounded bg-[#0b0e14] border border-[#30363d] font-mono text-[10px] space-y-1 text-[#8b949e]"></div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-3 border-t border-[#21262d]">
        <button onclick="closePruneModal()" class="px-3 py-1.5 rounded bg-[#21262d] hover:bg-[#30363d] text-slate-300 font-semibold border border-[#30363d] text-xs focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">Cancel</button>
        <button onclick="executeConfirmedPrune()" id="btn-confirm-prune" class="px-4 py-1.5 rounded bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs border border-rose-500 shadow-md flex items-center gap-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-400">
          <i class="fa-solid fa-trash-can" aria-hidden="true"></i> Delete worktrees
        </button>
      </div>
    </div>
  </div>

  <script src="/static/xterm.js"></script>
  <script src="/static/xterm-addon-fit.js"></script>
  <script>
    let activeRunId = null;
    let allRuns = [];
    let selectedProject = "all";
    let loadedProjects = [];
    let activeStitchTab = "stages";

    // progressByRun maps run_id → { complete, total, items } as last reported by
    // a ChannelProgress change. A missing key means "no progress reported" — the
    // operator sees an em dash rather than 0/N, because those are different
    // statements. Progress is reported, never proven: it never changes a run's
    // status display.
    const progressByRun = new Map();
    let currentProjectDefinition = null;
    let hasGateFailures = false;
    let lastSelectedRunStatus = null;
    let lastSelectedRunUpdatedAt = null;
    let lastFocusedBeforeModal = null;
    let pendingPruneTaskId = "";

    function setModalAriaHidden(hidden) {
      const layout = document.getElementById('main-layout-wrapper');
      if (layout) {
        if (hidden) {
          layout.setAttribute('aria-hidden', 'true');
        } else {
          layout.removeAttribute('aria-hidden');
        }
      }
    }

    function restoreModalFocus() {
      setModalAriaHidden(false);
      if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === 'function') {
        lastFocusedBeforeModal.focus();
      }
      lastFocusedBeforeModal = null;
    }

    function setConnectionError(isError) {
      const banner = document.getElementById('connection-error-banner');
      if (isError) {
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    // A failed run is a state on the run, not a destination. There is no Repair view:
    // its only real content was the failed phase's output, which the drawer already
    // shows, and its "Repair patch" panel was permanently empty because nothing
    // generates diffs.
    //
    // Deliberately no global "needs attention" indicator. Any such flag derived from
    // "some run has ever failed" is lit permanently, which is alarm fatigue and the
    // mirror of the reassurance fatigue this UI already had. Per D5 an indicator has
    // to name something a human can act on now; that needs the intent and bullet
    // model, which does not exist yet.
    function updateRepairTabState(hasFailure) {
      hasGateFailures = hasFailure;
    }

    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        loadedProjects = await res.json() || [];
        setConnectionError(false);

        // Only the header scope filter remains. The dispatch and project-config
        // selects it also fed were removed with those features.
        const select = document.getElementById('project-filter');
        select.innerHTML = '<option value="all">Global (All projects)</option>';
        loadedProjects.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.innerText = p.name;
          select.appendChild(opt);
        });
      } catch (err) {
        setConnectionError(true);
        console.error("Failed loading projects:", err);
      }
    }

    function onProjectChange() {
      selectedProject = document.getElementById('project-filter').value;
      activeRunId = null;
      lastSelectedRunStatus = null;
      lastSelectedRunUpdatedAt = null;
      fetchRuns();
    }





    let pendingProjectRefinePayload = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }














    async function cancelActiveRun() {
      if (!activeRunId) return;
      if (!confirm(`Stop and cancel run ${activeRunId}?`)) return;
      await fetch('/api/run-cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: activeRunId })
      });
      fetchRuns();
    }

    async function cleanActiveWorktrees(taskId = "") {
      lastFocusedBeforeModal = document.activeElement;
      setModalAriaHidden(true);
      pendingPruneTaskId = taskId;
      try {
        const res = await fetch('/api/clean-worktrees', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task_id: taskId, dry_run: true })
        });
        const data = await res.json();
        
        document.getElementById('prune-count').innerText = data.count || 0;
        const pathsList = document.getElementById('prune-paths-list');
        if (data.removed && data.removed.length > 0) {
          pathsList.innerHTML = data.removed.map(p => `<div><i class="fa-regular fa-folder mr-1" aria-hidden="true"></i>${p}</div>`).join('');
        } else {
          pathsList.innerHTML = '<div class="text-[#8b949e]">No unallocated worktrees found to delete.</div>';
        }

        const skipContainer = document.getElementById('prune-skipped-container');
        const skipList = document.getElementById('prune-skipped-list');
        if (data.skipped && data.skipped.length > 0) {
          skipContainer.classList.remove('hidden');
          skipList.innerHTML = data.skipped.map(s => `<div>${s.path} (${s.reason})</div>`).join('');
        } else {
          skipContainer.classList.add('hidden');
        }

        document.getElementById('prune-modal').classList.remove('hidden');
        setTimeout(() => document.getElementById('btn-confirm-prune').focus(), 50);
      } catch (err) {
        alert("Failed calculating worktree cleanup preview: " + err);
      }
    }

    function closePruneModal() {
      document.getElementById('prune-modal').classList.add('hidden');
      restoreModalFocus();
    }

    async function executeConfirmedPrune() {
      try {
        const res = await fetch('/api/clean-worktrees', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task_id: pendingPruneTaskId, dry_run: false })
        });
        if (res.ok) {
          closePruneModal();
          fetchFleet();
        } else {
          const t = await res.text();
          alert("Prune error: " + t);
        }
      } catch (err) {
        alert("Cleanup failed: " + err);
      }
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const origHTML = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fa-solid fa-check text-emerald-400" aria-hidden="true"></i> Copied';
        setTimeout(() => {
          btnElement.innerHTML = origHTML;
        }, 1800);
      }).catch(err => {
        prompt("Copy URL manually:", text);
      });
    }

    async function fetchFleet() {
      try {
        const res = await fetch('/api/fleet');
        const data = await res.json();
        setConnectionError(false);

        drawerLeases = data.leases || [];
        const workersActive = document.getElementById('stat-workers-active');
        if (workersActive) workersActive.innerText = drawerLeases.length;

        // Keep the drawer current if it is already showing workers.
        if (drawerIsOpen() && document.getElementById('drawer-kind').textContent === 'workers') {
          document.getElementById('drawer-title').textContent = `Workers & worktrees (${drawerLeases.length})`;
          document.getElementById('drawer-body').innerHTML = workersHTML(drawerLeases);
        }
      } catch (err) {
        setConnectionError(true);
        console.error("Failed fetching fleet:", err);
      }
    }
    // Renders the run list from allRuns, honouring the filter. Separated from
    // fetchRuns so typing in the filter re-renders without a network round trip.
    function renderRunList() {
      const listContainer = document.getElementById('sidebar-runs-list');
      const countSpan = document.getElementById('sidebar-runs-count');
      const shown = allRuns.filter(runMatchesFilter);

      if (runFilter && shown.length !== allRuns.length) {
        countSpan.innerText = `${shown.length}/${allRuns.length}`;
      } else {
        // Passed-out-of-completed, not passed-out-of-all: a still-running
        // run must never read as a failure just because it isn't done yet.
        // Same "honest" ratio fetchRuns() used to write to a footer badge
        // that the terminal drawer could cover; here it stays visible.
        const passed = allRuns.filter(r => r.status === 'passed').length;
        const done = allRuns.filter(r => ['passed', 'failed'].includes(r.status)).length;
        countSpan.innerText = done ? `${passed}/${done}` : String(allRuns.length);
      }

      if (allRuns.length === 0) {
        listContainer.innerHTML = '<div class="p-2 text-center text-[#8b949e] text-[10px]">No runs recorded.</div>';
        return;
      }
      if (shown.length === 0) {
        listContainer.innerHTML = `<div class="p-3 text-center text-[#8b949e] text-[10px]">No runs match <span class="font-mono text-slate-300">${escapeHTML(runFilter)}</span>.</div>`;
        return;
      }

      // Drop placeholders and any card that the filter now excludes.
      Array.from(listContainer.children).forEach(child => {
        if (!child.hasAttribute('data-run-id')) child.remove();
      });

      const existingButtons = Array.from(listContainer.querySelectorAll('[data-run-id]'));
      const existingMap = new Map(existingButtons.map(b => [b.getAttribute('data-run-id'), b]));

      shown.forEach(r => {
          const isSelected = (activeRunId === r.id);
          const isPass = r.status === 'passed';
          const isFail = r.status === 'failed';
          const isRun = r.status === 'running';
          const isCancelled = r.status === 'cancelled';

          let statusIcon = '<i class="fa-solid fa-circle-check text-emerald-400" aria-hidden="true"></i>';
          let statusBg = 'bg-emerald-950/40 text-emerald-400 border-emerald-800/40';
          let statusLabel = 'Passed';

          if (isFail) {
            statusIcon = '<i class="fa-solid fa-circle-xmark text-rose-400" aria-hidden="true"></i>';
            statusBg = 'bg-rose-950/40 text-rose-400 border-rose-800/40';
            statusLabel = 'Failed';
          } else if (isRun) {
            statusIcon = '<i class="fa-solid fa-spinner fa-spin text-amber-400" aria-hidden="true"></i>';
            statusBg = 'bg-amber-950/40 text-amber-400 border-amber-800/40';
            statusLabel = 'Running';
          } else if (isCancelled) {
            statusIcon = '<i class="fa-solid fa-ban text-[#8b949e]" aria-hidden="true"></i>';
            statusBg = 'bg-[#161b22] text-[#8b949e] border-[#30363d]';
            statusLabel = 'Cancelled';
          } else if (!isPass) {
            statusIcon = '<i class="fa-regular fa-circle text-[#8b949e]" aria-hidden="true"></i>';
            statusBg = 'bg-[#161b22] text-[#8b949e] border-[#30363d]';
            statusLabel = r.status;
          }

          let btn = existingMap.get(r.id);
          if (!btn) {
            btn = document.createElement('button');
            btn.setAttribute('data-run-id', r.id);
            btn.onclick = () => selectRun(r.id);
            listContainer.appendChild(btn);
          }

          btn.className = `w-full text-left p-2 rounded transition border text-[11px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff] ${isSelected ? 'bg-[#161b22] border-[#58a6ff] shadow-sm' : 'bg-[#0b0e14] border-[#21262d] hover:border-[#30363d]'}`;
          // Label the run with its slug, not its brief. A brief is a paragraph and
          // truncates to uselessness in a 187px card; a unix epoch forces the operator
          // to diff the last four digits of near-identical ids. The slug is a fixed
          // width, speakable label. The full brief lives in the detail header, where
          // there is room for it, and stays in the tooltip here.
          const brief = (r.brief || '').trim();
          const label = (r.slug || '').trim() || r.id;
          // Progress markers: one per checklist item. Only rendered when progress
          // has been reported. Absent plan = no markers (not zero). Progress is
          // shown alongside the status pill, never in place of it (R2.6).
          const prog = progressByRun.get(r.id);
          let progressRow = '';
          if (prog && prog.total > 0) {
            const dots = (prog.items || []).map(item => {
              const s = item.status || 'pending';
              if (s === 'complete')
                return `<i class="fa-solid fa-circle text-[#3fb950] text-[8px]" title="${escapeAttr(item.scenario || 'complete')}" aria-hidden="true"></i>`;
              if (s === 'in_progress')
                return `<i class="fa-solid fa-spinner fa-spin text-amber-400 text-[8px]" title="${escapeAttr(item.scenario || 'in progress')}" aria-hidden="true"></i>`;
              return `<i class="fa-regular fa-circle text-[#6e7681] text-[8px]" title="${escapeAttr(item.scenario || 'pending')}" aria-hidden="true"></i>`;
            }).join('');
            progressRow = `
              <div class="flex items-center gap-1 mt-0.5">
                <span class="flex items-center gap-0.5 flex-wrap">${dots}</span>
                <span class="text-[9px] text-[#6e7681] font-mono ml-1">${prog.complete}/${prog.total}</span>
              </div>`;
          } else if (prog && prog.total === 0) {
            // Zero-scenario plan: change declared no scenarios.
            progressRow = `<div class="text-[9px] text-[#6e7681] mt-0.5 italic">no scenarios</div>`;
          }

          btn.innerHTML = `
            <div class="flex justify-between items-center gap-2">
              <span class="text-[11px] font-semibold font-mono truncate ${isSelected ? 'text-white' : 'text-slate-200'}" title="${escapeAttr(brief || r.id)}">
                ${escapeHTML(label)}
              </span>
              <span class="px-1 py-0.5 rounded text-[9px] font-bold border shrink-0 ${statusBg}">
                ${statusIcon} ${escapeHTML(statusLabel)}
              </span>
            </div>
            <div class="flex justify-between items-center gap-2 mt-0.5 text-[10px] text-[#8b949e]">
              <span class="truncate">${escapeHTML(brief || r.project)}</span>
              <span class="shrink-0" title="${escapeAttr(r.created_at || '')}">${escapeHTML(relativeTime(r.created_at))}</span>
            </div>
            ${progressRow}
          `;
          existingMap.delete(r.id);
      });

      // Remove cards for runs that are gone or filtered out.
      existingMap.forEach(btn => btn.remove());
    }

    // ---- Run filter ----------------------------------------------------------
    let runFilter = '';

    function onRunFilterInput() {
      const input = document.getElementById('run-filter');
      runFilter = (input.value || '').trim().toLowerCase();
      document.getElementById('run-filter-clear').classList.toggle('hidden', runFilter === '');
      renderRunList();
    }

    function clearRunFilter() {
      const input = document.getElementById('run-filter');
      input.value = '';
      runFilter = '';
      document.getElementById('run-filter-clear').classList.add('hidden');
      renderRunList();
      input.focus();
    }

    // Matches the four fields a card actually shows, so what you type maps to what you
    // can see. Every term must match somewhere, which makes "cid failed" useful.
    function runMatchesFilter(r) {
      if (!runFilter) return true;
      const hay = [r.slug, r.brief, r.project, r.status, r.id, r.change_id]
        .filter(Boolean).join(' ').toLowerCase();
      return runFilter.split(/\s+/).every(term => hay.includes(term));
    }

    async function fetchRuns() {
      try {
        const url = selectedProject === 'all' ? '/api/runs' : `/api/runs?project=${encodeURIComponent(selectedProject)}`;
        const res = await fetch(url);
        allRuns = await res.json() || [];
        setConnectionError(false);

        const lastUpdatedEl = document.getElementById('last-updated');
        if (lastUpdatedEl) {
          lastUpdatedEl.innerText = `Updated ${new Date().toLocaleTimeString()}`;
        }

        // The pass ratio this used to write to a footer badge now renders
        // next to "Pipeline runs" in the sidebar instead (renderRunList),
        // which stays visible when the terminal drawer covers the footer.

        // Check globally if any run has failed gates
        const hasFailedRun = allRuns.some(r => r.status === 'failed');
        updateRepairTabState(hasFailedRun);

        renderRunList();

        if (allRuns.length === 0) {
          renderEmptyState();
          return;
        }


        if (!activeRunId && allRuns.length > 0) {
          selectRun(allRuns[0].id);
        } else if (activeRunId) {
          const current = allRuns.find(r => r.id === activeRunId);
          if (current) {
            // Only re-fetch details if status or timestamp changed
            if (current.status !== lastSelectedRunStatus || current.updated_at !== lastSelectedRunUpdatedAt) {
              selectRun(current.id);
            }
          } else if (allRuns.length > 0) {
            selectRun(allRuns[0].id);
          }
        }
      } catch (err) {
        setConnectionError(true);
        console.error("Failed fetching runs:", err);
      }
    }

    // A dispatch brief is often a dense, multi-sentence wall of text (every
    // file/function it names, every scenario it must cover) — shown in full
    // by default it pushes the actual pipeline view off screen. Truncate to
    // one glance-able length with an explicit toggle, rather than either
    // always showing everything or hiding it behind a click every time.
    const BRIEF_TRUNCATE_AT = 240;
    let briefExpanded = false;
    let briefFullText = '';

    function renderRunBrief(text) {
      briefFullText = (text || '').trim();
      briefExpanded = false;
      paintRunBrief();
    }

    function paintRunBrief() {
      const el = document.getElementById('active-run-brief');
      const toggle = document.getElementById('active-run-brief-toggle');
      if (!el || !toggle) return;
      const full = briefFullText;
      const needsToggle = full.length > BRIEF_TRUNCATE_AT;
      el.textContent = (!briefExpanded && needsToggle) ? full.slice(0, BRIEF_TRUNCATE_AT).trimEnd() + '…' : full;
      el.title = full;
      toggle.hidden = !needsToggle;
      toggle.textContent = briefExpanded ? 'Show less' : 'Show more';
    }

    function toggleRunBriefExpanded() {
      briefExpanded = !briefExpanded;
      paintRunBrief();
    }

    async function selectRun(runId) {
      activeRunId = runId;
      renderProgressPanel();
      const selected = allRuns.find(x => x.id === runId);
      // Show the speakable slug, with the canonical id available on hover.
      const badge = document.getElementById('stage-run-badge');
      const slug = (selected && selected.slug || '').trim();
      badge.innerText = slug || runId;
      badge.title = runId;
      renderRunBrief(selected && selected.brief);
      
      const current = allRuns.find(r => r.id === runId);
      const bannerStatus = document.getElementById('system-status-pill');

      if (current) {
        lastSelectedRunStatus = current.status;
        lastSelectedRunUpdatedAt = current.updated_at;
        document.getElementById('active-matrix-project').innerText = current.project;
        const meta = document.getElementById('active-run-meta');
        if (meta) {
          const parts = [];
          if (current.created_at) parts.push(relativeTime(current.created_at));
          if (current.change_id) parts.push(current.change_id);
          meta.innerText = parts.length ? '\u00b7 ' + parts.join(' \u00b7 ') : '';
          meta.title = current.id;
        }

        switch (current.status) {
          case 'passed':
            bannerStatus.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-[#3fb950] border border-emerald-800";
            bannerStatus.innerText = "● Passed";
            break;
          case 'running':
            bannerStatus.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-800 animate-pulse";
            bannerStatus.innerText = "● Running";
            break;
          case 'failed':
            bannerStatus.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-rose-950 text-rose-300 border border-rose-800";
            bannerStatus.innerText = "● Gate failed";
            break;
          case 'cancelled':
            bannerStatus.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-[#161b22] text-[#8b949e] border border-[#30363d]";
            bannerStatus.innerText = "● Cancelled";
            break;
          default:
            bannerStatus.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-[#161b22] text-slate-300 border border-[#30363d]";
            bannerStatus.innerText = `● ${current.status}`;
        }
      }

      try {
        const res = await fetch(`/api/run-details?id=${runId}`);
        const data = await res.json();
        setConnectionError(false);
        indexPhasesForDrawer(data.phases || []);
        activeRunSkips = data.resume_skips || [];
        renderWorkflowGraph(current, data.phases || []);
        renderActivity(data.envelopes || []);
        fetchDeliveryHistory(runId);
        refreshRunDrawer(current);
      } catch (err) {
        setConnectionError(true);
        console.error("Failed fetching run details:", err);
      }
    }

    function renderEmptyState() {
      document.getElementById('stage-run-badge').innerText = 'No run selected';
      const metaReset = document.getElementById('active-run-meta');
      if (metaReset) metaReset.innerText = '';
      renderRunBrief('');
      document.getElementById('active-matrix-project').innerText = 'None';
      document.getElementById('workflow-graph').innerHTML =
        '<div class="text-[#8b949e] text-[11px]">No pipeline runs recorded for this project. Dispatch one from your agent session or <code class="text-slate-300">POST /api/dispatch</code>.</div>';
      drawerActivity = [];
      drawerDeliveries = [];
      activeRunSkips = [];
      refreshRunDrawer(null);
      const envBadge = document.getElementById('activity-count');
      if (envBadge) envBadge.innerText = '0';
      renderProgressPanel();
    }

    function escapeHTML(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }
    const escapeAttr = escapeHTML;

    // Raw milliseconds ("45048ms") are unreadable at a glance, and a running phase
    // reporting "0ms" reads as an instantaneous result rather than "not finished".
    function formatDuration(ms) {
      if (ms == null || isNaN(ms)) return '\u2014';
      if (ms < 1000) return ms + 'ms';
      const s = ms / 1000;
      if (s < 60) return s.toFixed(s < 10 ? 1 : 0) + 's';
      const m = Math.floor(s / 60), rem = Math.round(s % 60);
      if (m < 60) return m + 'm' + (rem ? ' ' + rem + 's' : '');
      const h = Math.floor(m / 60);
      return h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
    }

    function relativeTime(iso) {
      if (!iso) return '';
      const then = new Date(iso).getTime();
      if (isNaN(then)) return '';
      const secs = Math.max(0, Math.round((Date.now() - then) / 1000));
      if (secs < 60) return secs + 's ago';
      const m = Math.round(secs / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.round(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.round(h / 24) + 'd ago';
    }

    // Phase status vocabulary. Every branch maps to a real status value; an
    // unrecognised status is displayed verbatim rather than mislabelled.
    const PHASE_LOOK = {
      passed:  { cls: 'text-[#3fb950]', icon: 'fa-solid fa-circle-check',  label: 'Passed' },
      failed:  { cls: 'text-rose-400',  icon: 'fa-solid fa-circle-xmark',  label: 'Failed' },
      running: { cls: 'text-[#58a6ff]', icon: 'fa-solid fa-spinner fa-spin', label: 'Running' },
      pending: { cls: 'text-[#8b949e]', icon: 'fa-regular fa-clock',       label: 'Pending' }
    };

    // ---- Detail drawer -------------------------------------------------------
    // Non-modal: no focus trap, no aria-modal. Focus moves in on open so a keyboard
    // user lands on the content, and returns to the opener on close.
    let drawerOpener = null;
    // Phases for the selected run, keyed by kind + name, so the drawer can be opened
    // from a matrix cell without refetching.
    let drawerPhaseIndex = new Map();

    function drawerKey(kind, name) { return (kind || '') + '\u0000' + name; }

    // Built where phases arrive, not inside the matrix renderer: rendering and
    // indexing are separate concerns, and the renderer is unit-tested in isolation.
    function indexPhasesForDrawer(phases) {
      drawerPhaseIndex = new Map();
      (phases || []).forEach(p => drawerPhaseIndex.set(drawerKey(p.kind, p.name), p));
    }

    function openDrawer(title, kind, bodyHTML, opener) {
      const d = document.getElementById('detail-drawer');
      document.getElementById('drawer-title').textContent = title;
      document.getElementById('drawer-kind').textContent = kind || '\u2014';
      document.getElementById('drawer-body').innerHTML = bodyHTML;
      d.setAttribute('aria-hidden', 'false');
      d.removeAttribute('inert');
      d.classList.remove('translate-x-full');
      drawerOpener = opener || document.activeElement;
      setTimeout(() => document.getElementById('drawer-close').focus(), 60);
    }

    function closeDrawer() {
      const d = document.getElementById('detail-drawer');
      if (d.getAttribute('aria-hidden') === 'true') return;
      d.setAttribute('aria-hidden', 'true');
      d.setAttribute('inert', '');
      d.classList.add('translate-x-full');
      if (drawerOpener && typeof drawerOpener.focus === 'function') drawerOpener.focus();
      drawerOpener = null;
    }

    function drawerIsOpen() {
      return document.getElementById('detail-drawer').getAttribute('aria-hidden') === 'false';
    }

    // ---- Embedded terminal -----------------------------------------------
    // One xterm.js Terminal + one WebSocket per session (design.md's "one
    // socket per session" protocol), independent of every other view on this
    // page and of each other. Nothing here is recorded or attributed to an
    // intent/bullet/phase (proposal.md's "out of scope") — it is unrecorded,
    // manual operator action, same trust boundary as every other
    // unrestricted local action this dashboard already exposes.
    const termSessions = new Map(); // id -> { term, fitAddon, socket, el, cwd, shell }
    let activeTermId = null;

    function openTerminalDrawer() {
      const d = document.getElementById('terminal-drawer');
      d.setAttribute('aria-hidden', 'false');
      d.removeAttribute('inert');
      d.classList.remove('translate-y-full');
      if (activeTermId) {
        const sess = termSessions.get(activeTermId);
        if (sess) setTimeout(() => { sess.fitAddon.fit(); sess.term.focus(); }, 60);
      }
    }

    // Hides the drawer without touching any session — the PTYs behind it
    // keep running, exactly like switching away from a terminal tab in any
    // other terminal emulator. Only an explicit kill ends a session.
    function closeTerminalDrawer() {
      const d = document.getElementById('terminal-drawer');
      d.setAttribute('aria-hidden', 'true');
      d.setAttribute('inert', '');
      d.classList.add('translate-y-full');
    }

    function toggleTerminalDrawer() {
      const open = document.getElementById('terminal-drawer').getAttribute('aria-hidden') === 'false';
      if (open) closeTerminalDrawer(); else openTerminalDrawer();
    }

    // startTerminalSession creates a new PTY-backed session and opens it in
    // the drawer. opts.bulletId, when given, is the "resolve in worktree"
    // entry point: the server resolves it to that bullet's real worktree
    // path (design.md), not a path this page guesses at.
    async function startTerminalSession(opts) {
      const body = {};
      if (opts && opts.bulletId) body.bullet_id = opts.bulletId;

      let res;
      try {
        res = await fetch('/api/terminal-start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } catch (err) {
        alert('Failed starting terminal: ' + err);
        return;
      }
      if (!res.ok) {
        alert('Failed starting terminal: ' + (await res.text()));
        return;
      }
      const info = await res.json();
      createTermSession(info);
      openTerminalDrawer();
    }

    function createTermSession(info) {
      const pane = document.createElement('div');
      pane.id = `term-pane-${info.id}`;
      pane.className = 'absolute inset-0 p-1 hidden';
      document.getElementById('terminal-panes').appendChild(pane);

      const term = new Terminal({
        convertEol: true,
        cursorBlink: true,
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 12,
        theme: { background: '#0b0e14', foreground: '#c9d1d9' },
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(pane);

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${wsProto}://${location.host}/api/terminal-socket?id=${encodeURIComponent(info.id)}`);
      socket.binaryType = 'arraybuffer';

      socket.addEventListener('open', () => {
        fitAddon.fit();
        socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      });
      socket.addEventListener('message', (ev) => {
        if (typeof ev.data === 'string') {
          let msg = null;
          try { msg = JSON.parse(ev.data); } catch (err) { return; }
          if (msg && msg.type === 'exit') {
            term.write(`\r\n\x1b[90m[process exited with code ${msg.code}]\x1b[0m\r\n`);
          }
          return;
        }
        term.write(new Uint8Array(ev.data));
      });
      socket.addEventListener('close', () => {
        term.write('\r\n\x1b[90m[connection closed]\x1b[0m\r\n');
      });

      term.onData((data) => {
        // socket.send(string) always produces a WebSocket TEXT frame per the
        // spec, regardless of socket.binaryType — that property only governs
        // how incoming frames are delivered to JS. The server's read loop
        // (internal/ui/terminal.go) only writes BINARY frames to the PTY and
        // treats TEXT frames as the JSON resize control message, so sending
        // keystrokes as text silently drops every one of them. Encode to
        // bytes first so the browser actually sends a binary frame.
        if (socket.readyState === WebSocket.OPEN) socket.send(new TextEncoder().encode(data));
      });
      term.onResize(({ cols, rows }) => {
        if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'resize', cols, rows }));
      });

      termSessions.set(info.id, { term, fitAddon, socket, el: pane, cwd: info.cwd, shell: info.shell });
      activateTermSession(info.id);
    }

    function terminalTabLabel(sess, fallback) {
      const path = (sess.cwd || '').replace(/\/+$/, '');
      return (path ? path.split('/').pop() : '') || fallback;
    }

    function renderTermTabs() {
      const bar = document.getElementById('terminal-tabs');
      const tabs = [];
      let i = 0;
      termSessions.forEach((sess, id) => {
        i++;
        const active = id === activeTermId;
        const label = terminalTabLabel(sess, `Session ${i}`);
        tabs.push(`
          <span role="tab" aria-selected="${active}" class="shrink-0 flex items-center gap-1.5 px-2 py-1 rounded-t text-[10px] font-bold cursor-pointer ${active ? 'bg-[#0b0e14] text-white border border-[#30363d] border-b-0' : 'bg-[#161b22] text-[#8b949e] hover:text-white'}"
            onclick="activateTermSession('${escapeAttr(id)}')">
            <i class="fa-solid fa-terminal text-[9px]" aria-hidden="true"></i>
            <span class="max-w-[8rem] truncate" title="${escapeAttr(sess.cwd || sess.shell || '')}">${escapeHTML(label)}</span>
            <button type="button" onclick="event.stopPropagation(); killTermSession('${escapeAttr(id)}')" aria-label="Close terminal session" title="Close terminal session"
              class="hover:text-rose-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]"><i class="fa-solid fa-xmark text-[9px]" aria-hidden="true"></i></button>
          </span>`);
      });
      bar.innerHTML = tabs.join('');
    }

    function activateTermSession(id) {
      activeTermId = id;
      termSessions.forEach((sess, sid) => sess.el.classList.toggle('hidden', sid !== id));
      renderTermTabs();
      const sess = termSessions.get(id);
      if (sess) setTimeout(() => { sess.fitAddon.fit(); sess.term.focus(); }, 0);
    }

    // killTermSession always calls /api/terminal-kill, even if the local
    // session object is already gone — killing an unknown or already-dead
    // id is not an error (design.md), so there is nothing to guard here.
    async function killTermSession(id) {
      const sess = termSessions.get(id);
      if (sess) {
        try { sess.socket.close(); } catch (err) { /* already closed */ }
        sess.term.dispose();
        sess.el.remove();
        termSessions.delete(id);
      }
      try {
        await fetch('/api/terminal-kill', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
      } catch (err) {
        console.error('Failed killing terminal session:', err);
      }

      if (activeTermId === id) {
        activeTermId = null;
        const next = termSessions.keys().next();
        if (!next.done) activateTermSession(next.value);
      }
      renderTermTabs();
    }

    window.addEventListener('resize', () => {
      if (!activeTermId) return;
      const sess = termSessions.get(activeTermId);
      if (sess) sess.fitAddon.fit();
    });

    // Renders whatever the phase payload actually holds. Gates store
    // {gate_name, command, passed, output}; agent phases store {agent, attempt,
    // raw_output}. Anything absent renders as an em dash rather than a guess.
    function phaseDetailHTML(phase) {
      const p = phase.payload || {};
      const look = PHASE_LOOK[phase.status] || { cls: 'text-[#8b949e]', label: phase.status };
      const rows = [
        ['Status', `<span class="${look.cls} font-bold">${escapeHTML(look.label)}</span>`],
        ['Repo', escapeHTML(phase.repo || '\u2014')],
        ['Duration', escapeHTML(phase.status === 'running' ? 'running' : formatDuration(phase.duration_ms))],
      ];
      if (p.branch) rows.push(['Branch', `<code class="text-[#58a6ff]">${escapeHTML(p.branch)}</code>`]);
      if (p.worktree) {
        rows.push(['Worktree', `<span class="flex items-start gap-1.5 min-w-0">
          <code class="text-slate-300 break-all min-w-0">${escapeHTML(p.worktree)}</code>
          <button type="button" onclick="copyToClipboard('${escapeAttr(p.worktree)}', this)"
            aria-label="Copy worktree path" title="Copy worktree path"
            class="shrink-0 px-1 rounded text-[#8b949e] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]"><i class="fa-regular fa-copy text-[10px]" aria-hidden="true"></i></button>
        </span>`]);
      }
      if (p.command) rows.push(['Command', `<code class="text-amber-300 break-all">${escapeHTML(p.command)}</code>`]);
      if (p.agent) rows.push(['Agent', `<code class="text-teal-300">${escapeHTML(p.agent)}</code>`]);
      // R4.6: model/provider are derived from real evidence of what executed
      // the phase (e.g. an agent's own startup banner), not from requested
      // configuration — absent when that evidence could not be parsed
      // (an agent this project does not yet recognize), so both render only
      // when actually known rather than as a blank or guessed value.
      if (p.model) rows.push(['Model', `<code class="text-teal-300">${escapeHTML(p.model)}</code>`]);
      if (p.provider) rows.push(['Provider', `<code class="text-teal-300">${escapeHTML(p.provider)}</code>`]);
      if (p.attempt) rows.push(['Attempt', escapeHTML(p.attempt)]);
      if (phase.error) rows.push(['Error', `<span class="text-rose-400 break-all">${escapeHTML(phase.error)}</span>`]);

      const output = p.output || p.raw_output || p.malformed_raw || '';
      const outBlock = output.trim()
        ? `<pre class="mt-1 p-2 rounded bg-[#161b22] border border-[#21262d] text-[10px] leading-relaxed text-slate-300 whitespace-pre-wrap break-all max-h-[28rem] overflow-y-auto">${escapeHTML(output.trim())}</pre>`
        : `<div class="text-[#8b949e]">No output captured for this phase.</div>`;

      return `
        <dl class="grid grid-cols-[5.5rem_1fr] gap-x-3 gap-y-1">
          ${rows.map(([k, v]) => `<dt class="text-[#8b949e]">${escapeHTML(k)}</dt><dd class="min-w-0">${v}</dd>`).join('')}
        </dl>
        <div>
          <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider mb-1">Output</div>
          ${outBlock}
        </div>`;
    }

    // ---- Run detail and resume -----------------------------------------------
    //
    // The phase names a resume would skip, exactly as the server derived them
    // (/api/run-details resume_skips). They are held rather than recomputed here:
    // "which phases already passed" is the rule POST /api/run-resume enforces, and
    // a second derivation in this page could disagree with what the resume does.
    let activeRunSkips = [];

    function runDrawerTitle(run) {
      if (!run) return 'No run selected';
      return (run.slug || '').trim() || run.id;
    }

    // Renders the drawer body for one run.
    //
    // The resume control appears if and only if the served run says it may be
    // resumed. This page holds no list of qualifying statuses: the server's
    // refusal is authoritative, and a copy of its rule here would drift and start
    // inviting actions the server rejects. An absent answer is not a yes, so a
    // payload without the field offers nothing.
    function runDetailHTML(run, skips, blockedBullets) {
      if (!run) return '<div class="text-[#8b949e]">No run selected.</div>';

      const rows = [
        ['Status', escapeHTML(run.status || '—')],
        ['Project', escapeHTML(run.project || '—')],
        ['Change', escapeHTML(run.change_id || '—')],
        ['Run id', `<code class="text-slate-300 break-all">${escapeHTML(run.id || '—')}</code>`],
        ['Started', escapeHTML(run.created_at ? relativeTime(run.created_at) : '—')],
        ['Updated', escapeHTML(run.updated_at ? relativeTime(run.updated_at) : '—')],
      ];
      const meta = `
        <dl class="grid grid-cols-[5.5rem_1fr] gap-x-3 gap-y-1">
          ${rows.map(([k, v]) => `<dt class="text-[#8b949e]">${escapeHTML(k)}</dt><dd class="min-w-0">${v}</dd>`).join('')}
        </dl>`;

      // "Resolve the underlying cause directly -- in the bullet's worktree"
      // (skills/dispatch/SKILL.md Step 4, proposal.md's Problem statement):
      // a blocked bullet with a known worktree gets a one-click path from
      // "this is stuck" to a real shell open in the exact worktree that
      // produced it. A bullet without a recorded worktree offers nothing
      // here rather than guessing a path.
      const blocked = (blockedBullets || []).filter(b => b.worktree);
      const blockedBlock = blocked.length ? `
        <div class="p-2 rounded bg-[#161b22] border border-[#30363d] space-y-2">
          <div class="text-[9px] uppercase font-bold text-amber-400 tracking-wider">Blocked</div>
          ${blocked.map(b => `
            <div class="space-y-1">
              <div class="text-slate-300"><span class="font-mono text-amber-300">${escapeHTML(b.repo)}</span> — ${escapeHTML(b.blocked_reason || 'Blocked; no reason recorded.')}</div>
              <button type="button" onclick="startTerminalSession({bulletId: '${escapeAttr(b.id)}'})"
                class="px-2 py-1 rounded bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-slate-300 hover:text-white text-[10px] font-bold flex items-center gap-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
                <i class="fa-solid fa-terminal text-[10px]" aria-hidden="true"></i> Resolve in ${escapeHTML(b.repo)} worktree
              </button>
            </div>`).join('')}
        </div>` : '';

      if (!run.resumable) return `${meta}${blockedBlock}`;

      // What the resume will not do, named before it is done. A resume that
      // silently skipped four gates would leave the operator unable to tell
      // whether those gates ever ran.
      const names = (skips || []).filter(Boolean);
      const skipBlock = names.length
        ? `<ul class="list-disc pl-4 space-y-0.5 font-mono text-[10px] text-slate-300">
             ${names.map(n => `<li>${escapeHTML(n)}</li>`).join('')}
           </ul>`
        : '<div class="text-[#8b949e]">No phase holds a passed record, so this resume skips none.</div>';

      return `${meta}${blockedBlock}
        <div class="p-2 rounded bg-[#161b22] border border-[#30363d] space-y-2">
          <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider">Resume</div>
          <div class="text-slate-300">Re-enters this run in the worktree and branch it already holds.</div>
          <div>
            <div class="text-[9px] uppercase font-bold text-[#8b949e] tracking-wider mb-1">Phases it will skip</div>
            ${skipBlock}
          </div>
          <button type="button" id="btn-resume-run" onclick="resumeRun('${escapeAttr(run.id)}')"
            class="px-2 py-1 rounded bg-[#161b22] hover:bg-[#21262d] border border-[#30363d] text-slate-300 hover:text-white text-[10px] font-bold flex items-center gap-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]">
            <i class="fa-solid fa-rotate-left text-[10px]" aria-hidden="true"></i> Resume run
          </button>
          <div id="resume-refusal" role="alert" class="hidden text-rose-300 font-mono text-[10px] break-all"></div>
        </div>`;
    }

    // blockedBulletsForRun answers the blocked bullets behind runId's
    // intent, reusing bulletsForRun's existing /api/bullets fetch (defined
    // below) rather than a second endpoint. A run with no intent or a fetch
    // failure both resolve to no blocked bullets, matching bulletsForRun's
    // own no-bullets-is-not-an-error contract.
    async function blockedBulletsForRun(runId) {
      if (!runId) return [];
      const byRepo = await bulletsForRun(runId);
      return Array.from(byRepo.values()).filter(b => b.status === 'blocked');
    }

    async function openRunDrawer(opener) {
      const run = allRuns.find(r => r.id === activeRunId) || null;
      const blocked = run ? await blockedBulletsForRun(run.id) : [];
      openDrawer(runDrawerTitle(run), 'run', runDetailHTML(run, activeRunSkips, blocked), opener);
    }

    // Keeps an open run drawer current. Called where run details arrive, so the
    // resume control disappears the moment the served run stops offering it --
    // including the transition the stream carries after a resume is accepted.
    async function refreshRunDrawer(run) {
      if (!drawerIsOpen()) return;
      if (document.getElementById('drawer-kind').textContent !== 'run') return;
      const blocked = run ? await blockedBulletsForRun(run.id) : [];
      document.getElementById('drawer-title').textContent = runDrawerTitle(run);
      document.getElementById('drawer-body').innerHTML = runDetailHTML(run, activeRunSkips, blocked);
    }

    // Displays a refusal in the server's own words. This page did not decide the
    // refusal and must not compose an explanation for it.
    function showResumeRefusal(text) {
      const el = document.getElementById('resume-refusal');
      if (!el) return;
      const reason = (text || '').trim();
      el.textContent = reason;
      if (reason === '') {
        el.classList.add('hidden');
      } else {
        el.classList.remove('hidden');
      }
    }

    async function resumeRun(runId) {
      const names = (activeRunSkips || []).filter(Boolean);
      const skipLine = names.length
        ? `${names.length} phase(s) will be skipped: ${names.join(', ')}.`
        : 'No phase holds a passed record, so every phase runs again.';
      if (!confirm(`Resume run ${runId}?\n\n${skipLine}`)) return;

      showResumeRefusal('');
      try {
        const res = await fetch('/api/run-resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: runId })
        });
        if (!res.ok) {
          showResumeRefusal(await res.text());
          return;
        }
        // Deliberately no read back. The run moving to running is a change the
        // sequenced stream already publishes, and the existing render path applies
        // it. Re-reading here would reintroduce the polling that was removed.
      } catch (err) {
        setConnectionError(true);
        console.error('Failed calling /api/run-resume:', err);
      }
    }

    function openPhaseDrawer(kind, name, opener) {
      const phase = drawerPhaseIndex.get(drawerKey(kind, name));
      if (!phase) return;
      openDrawer(name, kind === 'code' ? 'gate' : kind, phaseDetailHTML(phase), opener);
    }

    function phaseCellHTML(phase) {
      if (!phase) {
        return '<span class="text-[#8b949e]">&mdash;</span>';
      }
      const look = PHASE_LOOK[phase.status] || { cls: 'text-[#8b949e]', icon: '', label: phase.status };
      const icon = look.icon ? `<i class="${look.icon} text-[9px]" aria-hidden="true"></i> ` : '';
      const dur = (phase.status === 'running') ? 'running' : formatDuration(phase.duration_ms);
      return `
        <div class="flex justify-between items-center text-[10px] gap-2">
          <span class="${look.cls} font-bold flex items-center gap-1">${icon}${escapeHTML(look.label)}</span>
          <span class="text-[#8b949e] font-mono">${escapeHTML(dur)}</span>
        </div>
        ${phase.error ? `<div class="text-[10px] text-rose-400 font-mono truncate" title="${escapeAttr(phase.error)}">${escapeHTML(phase.error)}</div>` : ''}`;
    }

    function deliveryCellHTML(envelopes, repo) {
      // Read the delivery state from the review envelope. Never infer "PR ready"
      // from phase statuses — a green pipeline is not a pull request.
      const env = (envelopes || []).find(e => e.stage === 'review' && (e.repo === repo || !repo));
      if (!env) {
        return '<span class="text-[#8b949e]">&mdash;</span>';
      }
      const d = env.data || {};
      let cls = 'text-[#8b949e]', icon = 'fa-regular fa-clock', label = 'No changes';
      if (d.commits > 0 && d.pushed)      { cls = 'text-[#3fb950]'; icon = 'fa-solid fa-code-pull-request'; label = 'Pushed'; }
      else if (d.commits > 0)             { cls = 'text-[#58a6ff]'; icon = 'fa-solid fa-code-commit';       label = `${d.commits} commit${d.commits === 1 ? '' : 's'}`; }
      else if (d.dirty)                   { cls = 'text-amber-400';  icon = 'fa-solid fa-triangle-exclamation'; label = 'Uncommitted'; }
      return `
        <div class="flex justify-between items-center text-[10px] gap-2">
          <span class="${cls} font-bold flex items-center gap-1"><i class="${icon} text-[9px]" aria-hidden="true"></i> ${escapeHTML(label)}</span>
        </div>
        <div class="text-[10px] text-[#8b949e] font-mono truncate" title="${escapeAttr(d.branch || '')}">${escapeHTML(d.branch || '')}</div>`;
    }

    // Cached workflow definitions per repo, so the graph can draw stages that have
    // not started yet. Without the definition the view can only show history.
    const workflowDefs = new Map();

    async function workflowDefFor(project, repo) {
      const key = project + '\u0000' + repo;
      if (workflowDefs.has(key)) return workflowDefs.get(key);
      try {
        const res = await fetch(`/api/workflow?project=${encodeURIComponent(project)}&repo=${encodeURIComponent(repo)}`);
        if (!res.ok) return null;
        const def = await res.json();
        workflowDefs.set(key, def);
        return def;
      } catch (err) {
        console.error('Failed fetching workflow definition:', err);
        return null;
      }
    }

    // Node appearance by state. "pending" is a real state, not an absence: the node is
    // in the definition and has not run.
    const NODE_LOOK = {
      passed:  { text: 'text-[#3fb950]', icon: 'fa-solid fa-circle-check' },
      failed:  { text: 'text-rose-400',  icon: 'fa-solid fa-circle-xmark' },
      running: { text: 'text-[#58a6ff]', icon: 'fa-solid fa-spinner fa-spin' },
      pending: { text: 'text-[#6e7681]', icon: 'fa-regular fa-circle' },
    };

    // Fixed geometry. Positions are computed rather than measured so the SVG edge
    // layer and the cards agree without a second layout pass.
    const GEO = { nodeW: 232, nodeH: 34, colGap: 56, rowGap: 10, wrapGap: 34, groupPadX: 8, groupPadY: 8, groupHead: 20, padX: 12, padY: 12 };

    function phaseForNode(node, phaseByKey) {
      const wanted = node.kind === 'gate' ? 'code' : node.kind === 'stage' ? 'agent' : null;
      if (!wanted) return null;
      return phaseByKey.get(wanted + '\u0000' + node.label)
          || phaseByKey.get((wanted === 'code' ? 'agent' : 'code') + '\u0000' + node.label)
          || null;
    }

    // BULLET_PROGRESSION mirrors store.BulletProgression() (Go): the ordered
    // lifecycle a bullet advances through, excluding "failed"/"blocked" —
    // those are reachable from any earlier state, not a step after "merged",
    // so they are not rendered as one of these fixed lifecycle nodes.
    const BULLET_PROGRESSION = ['pending', 'red', 'green', 'sealed', 'merged'];

    // lifecyclePhaseForNode turns a bullet's real status into the same
    // {status: ...} shape phaseForNode returns, so a lifecycle node renders
    // through the exact same nodeCardHTML/NODE_LOOK path a stage or gate
    // does. A stage at or before the bullet's current position in
    // BULLET_PROGRESSION has been reached ("passed"); anything after has
    // not ("pending" — the existing null-phase fallback already renders
    // this way, so returning null here is equivalent and cheaper).
    //
    // "failed"/"blocked" are not positions in BULLET_PROGRESSION, and a
    // BulletRecord alone does not say which stage a stuck bullet last
    // reached — asserting one here would overclaim what is actually known,
    // so every lifecycle node still renders as not-reached for those two
    // statuses, exactly as it did before bullet status was wired in at all.
    function lifecyclePhaseForNode(node, bullet) {
      if (!bullet) return null;
      const bulletIdx = BULLET_PROGRESSION.indexOf(bullet.status);
      if (bulletIdx === -1) return null;
      const nodeIdx = BULLET_PROGRESSION.indexOf(node.label);
      return nodeIdx <= bulletIdx ? { status: 'passed' } : null;
    }

    // Columns come from the definition's shape, not from a hardcoded list:
    // each pipeline stage is its own column, the gates share one column as a
    // labelled group because the engine runs them all inside the test
    // stage, and the delivery lifecycle is its own group whose per-node
    // status comes from the run's actual bullet (bullet may be undefined
    // for a run with no bullet yet, e.g. one predating intent tracking —
    // every lifecycle node then falls back to not-reached, same as before
    // bullet status was wired in).
    function buildGraphLayout(def, phaseByKey, bullet) {
      const nodes = (def && def.nodes) ? def.nodes : [];
      const cols = [];

      nodes.filter(n => n.kind === 'stage').forEach(n => {
        cols.push({ cells: [{ type: 'node', node: n, phase: phaseForNode(n, phaseByKey) }] });
      });

      const gates = nodes.filter(n => n.kind === 'gate');
      if (gates.length) {
        cols.push({ cells: [{
          type: 'group', label: 'Gates',
          items: gates.map(n => ({ node: n, phase: phaseForNode(n, phaseByKey) })),
        }] });
      }

      const life = nodes.filter(n => n.kind === 'lifecycle');
      if (life.length) {
        cols.push({ cells: [{
          type: 'group', label: 'Delivery',
          items: life.map(n => ({ node: n, phase: lifecyclePhaseForNode(n, bullet) })),
        }] });
      }
      return cols;
    }

    function cellHeight(cell) {
      if (cell.type === 'node') return GEO.nodeH;
      return GEO.groupHead + GEO.groupPadY * 2 + cell.items.length * GEO.nodeH + (cell.items.length - 1) * GEO.rowGap;
    }

    function columnWidth(col) {
      return col.cells.some(c => c.type === 'group') ? GEO.nodeW + GEO.groupPadX * 2 : GEO.nodeW;
    }

    // Packs columns into rows that fit availWidth, then positions every cell.
    // The graph wraps rather than scrolling sideways: a pipeline you have to scroll to
    // read is a pipeline you cannot see. Every row still runs left to right, so the
    // reading direction never reverses; a wrap connector carries the eye down.
    function positionLayout(cols, availWidth) {
      const usable = Math.max(GEO.nodeW + GEO.padX * 2, availWidth) - GEO.padX * 2;

      // Pack: greedily fill a row until the next column will not fit.
      const rows = [];
      let row = [], rowW = 0;
      cols.forEach(col => {
        const w = columnWidth(col);
        const needed = row.length === 0 ? w : rowW + GEO.colGap + w;
        if (row.length > 0 && needed > usable) {
          rows.push(row);
          row = [col]; rowW = w;
        } else {
          row.push(col); rowW = needed;
        }
      });
      if (row.length) rows.push(row);

      const placed = [];
      let y = GEO.padY;
      let maxRight = 0;

      rows.forEach((rowCols, ri) => {
        const rowH = Math.max(...rowCols.map(c =>
          c.cells.reduce((a, cell) => a + cellHeight(cell), 0) + (c.cells.length - 1) * GEO.rowGap));
        let x = GEO.padX;
        rowCols.forEach((col, ciInRow) => {
          const w = columnWidth(col);
          let cy = y;
          col.cells.forEach(cell => {
            const h = cellHeight(cell);
            placed.push({
              cell, row: ri, colInRow: ciInRow, x, y: cy, w, h,
              inAnchor:  { x: x,     y: cy + h / 2 },
              outAnchor: { x: x + w, y: cy + h / 2 },
            });
            cy += h + GEO.rowGap;
          });
          x += w + GEO.colGap;
          maxRight = Math.max(maxRight, x - GEO.colGap);
        });
        y += rowH + GEO.wrapGap;
      });

      return { placed, rows: rows.length, width: maxRight + GEO.padX, height: y - GEO.wrapGap + GEO.padY };
    }

    // LIFECYCLE_MEANING explains each Delivery stage on hover \u2014 an operator
    // reading "sealed" or "merged" for the first time has no other way to
    // learn what sergeant means by them without reading the source.
    const LIFECYCLE_MEANING = {
      pending: 'Bullet created; no gate evidence recorded yet.',
      red:     'A failing gate result has been recorded \u2014 proof the test was written before the fix (decision D3).',
      green:   'All gates passed.',
      sealed:  'A human explicitly approved this bullet\u2019s delivery by creating its pull request (only possible once green). Records that the approval happened, not that a PR necessarily exists on the host.',
      merged:  'Sergeant observed this bullet\u2019s pull request as merged on the host. Sergeant never merges anything itself (decision D6) \u2014 this only reflects what actually happened.',
    };

    function nodeCardHTML(node, phase, absolute) {
      const state = phase ? (NODE_LOOK[phase.status] ? phase.status : 'pending') : 'pending';
      const look = NODE_LOOK[state];
      const dur = phase ? (phase.status === 'running' ? 'running' : formatDuration(phase.duration_ms)) : '';
      const pl = (phase && phase.payload) || {};
      const branch = (pl.branch || '').trim();
      const worktree = (pl.worktree || '').trim();
      const kindLabel = node.kind === 'gate' ? 'gate' : node.kind === 'lifecycle' ? 'delivery' : 'stage';
      const meaning = node.kind === 'lifecycle' ? (LIFECYCLE_MEANING[node.label] || '') : '';
      const titleAttr = meaning ? ` title="${escapeAttr(meaning)}"` : '';

      const clickable = !!phase;
      const tag = clickable ? 'button' : 'div';
      const pos = absolute ? `position:absolute;left:${absolute.x}px;top:${absolute.y}px;width:${GEO.nodeW}px;height:${GEO.nodeH}px;` : `width:${GEO.nodeW}px;height:${GEO.nodeH}px;`;
      const shell = clickable
        ? `type="button" onclick="openPhaseDrawer('${escapeAttr(phase.kind || '')}','${escapeAttr(phase.name)}', this)"${titleAttr}
           aria-label="${escapeAttr(node.label + ' ' + kindLabel + ', ' + phase.status + (worktree ? ', worktree ' + worktree : '') + (meaning ? '. ' + meaning : '') + '. Open detail.')}"
           class="group flex items-center gap-2 px-2.5 rounded-md border border-[#30363d] bg-[#161b22] hover:border-[#58a6ff] hover:bg-[#1c2430] cursor-pointer transition text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#58a6ff]"`
        : `${titleAttr}
           aria-label="${escapeAttr(node.label + ' ' + kindLabel + ', not started' + (meaning ? '. ' + meaning : ''))}"
           class="flex items-center gap-2 px-2.5 rounded-md border border-dashed border-[#30363d] bg-transparent"`;

      return `<${tag} style="${pos}" ${shell}>
        <i class="${look.icon} ${look.text} text-[11px] shrink-0" aria-hidden="true"></i>
        <span class="text-[11px] font-semibold ${clickable ? 'text-slate-100' : 'text-[#6e7681]'} truncate">${escapeHTML(node.label)}</span>
        ${branch || worktree ? `<i class="fa-solid fa-folder-tree text-[8px] text-[#6e7681] shrink-0" title="${escapeAttr([branch, worktree].filter(Boolean).join(' \u2014 '))}" aria-hidden="true"></i>` : ''}
        <span class="ml-auto shrink-0 font-mono text-[10px] ${phase ? 'text-[#8b949e]' : 'text-[#6e7681]'}">${escapeHTML(dur || (phase ? '' : 'not started'))}</span>
      </${tag}>`;
    }

    function groupBoxHTML(cell, x, y, w, h) {
      const inner = cell.items.map((it, i) => nodeCardHTML(it.node, it.phase, {
        x: GEO.groupPadX,
        y: GEO.groupHead + GEO.groupPadY + i * (GEO.nodeH + GEO.rowGap),
      })).join('');
      return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;" class="rounded-md border border-[#30363d] bg-[#0d1117]">
        <div class="absolute left-0 top-0 px-2 h-[${GEO.groupHead}px] flex items-center text-[9px] uppercase tracking-wider font-bold text-[#6e7681]">${escapeHTML(cell.label)}</div>
        ${inner}
      </div>`;
    }

    // Edges are cubic beziers with a horizontal control offset, which is what gives the
    // Actions graph its fan-out. Straight 1px rules read as a table rule, not a graph.
    //
    // A wrap boundary is drawn differently: the eye has to travel from the right edge of
    // one row to the left edge of the next, so that edge exits right, drops into the
    // gutter between rows, and re-enters from the left. Drawing it as a straight
    // diagonal across the canvas would cross every intervening node.
    function edgesSVG(placed, width, height) {
      const groups = new Map(); // "row:colInRow" -> cells
      placed.forEach(pl => {
        const k = pl.row + ':' + pl.colInRow;
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(pl);
      });

      // Column order across the whole graph, following the wrap.
      const order = [...groups.keys()].sort((a, b) => {
        const [ar, ac] = a.split(':').map(Number), [br, bc] = b.split(':').map(Number);
        return ar - br || ac - bc;
      });

      let paths = '', dots = '';
      for (let i = 0; i < order.length - 1; i++) {
        const from = groups.get(order[i]), to = groups.get(order[i + 1]);

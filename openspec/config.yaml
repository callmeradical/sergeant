schema: spec-driven

context: |
  This is sergeant v1: the bash/tmux toolbelt in bin/sgt-* plus the Go
  cmd/sergeant-mcp MCP server that wraps it. Read AGENTS.md before changing
  behaviour. sergeant-v2 (a separate Go-native rewrite under internal/) lives
  on the v2 branch and is out of scope here -- do not conflate the two.

  PRDs for v1 changes live at docs/prd-<slug>.md and must be approved (Status:
  Draft -> approved) before an OpenSpec change proceeds past drafting.


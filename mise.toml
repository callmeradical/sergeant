[tools]
# Sergeant supports Bash 3.2+ and uses Python 3 for bounded JSON/state handling.

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Symlink sgt-* scripts into ~/.local/bin so they're on your PATH"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO_DIR="$(cd "$(dirname "$MISE_ORIGINAL_CWD")" && pwd)/$(basename "$MISE_ORIGINAL_CWD")"
# Resolve to actual repo root regardless of where mise is invoked from
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
BIN_DIR="$REPO_DIR/bin"
TARGET_DIR="${SGT_INSTALL_DIR:-$HOME/.local/bin}"

mkdir -p "$TARGET_DIR"

linked=0
# Glob every sourced helper: enumerating them by name silently broke the install
# whenever a new bin/_sgt-*.sh helper was added (bin/_sgt-review-axes.sh).
for f in "$BIN_DIR"/sgt-* "$BIN_DIR"/_sgt-*.sh "$BIN_DIR/wiki-daily-digest"; do
  [[ -f "$f" ]] || continue
  name="$(basename "$f")"
  ln -sf "$f" "$TARGET_DIR/$name"
  echo "  linked: $TARGET_DIR/$name -> $f"
  linked=$((linked+1))
done

# Remove legacy oc-inject links that may still exist from earlier Sergeant
# checkouts. oc-inject was deleted in August 2026 (GH #179). The file no
# longer ships in bin/ so any remaining symlinks are stale.
for deprecated_link in "$TARGET_DIR/oc-inject" "$HOME/.config/opencode/plugins/oc-inject.js"; do
  [[ -L "$deprecated_link" ]] || continue
  rm "$deprecated_link"
  echo "  removed stale oc-inject link: $deprecated_link"
done

echo ""
echo "Installed $linked scripts to $TARGET_DIR"

# Check PATH
if ! echo "$PATH" | tr ':' '\\n' | grep -qxF "$TARGET_DIR"; then
  echo ""
  echo "WARNING: $TARGET_DIR is not on your PATH."
  echo "Add this to your shell config (~/.zshrc or ~/.bashrc):"
  echo "  export PATH=\"$TARGET_DIR:\\$PATH\""
fi

# Install git hooks from scripts/hooks/ into .git/hooks/
hooks_src="$REPO_DIR/scripts/hooks"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
if [[ -d "$hooks_src" && -d "$hooks_dst" ]]; then
  for hook in "$hooks_src"/*; do
    [[ -f "$hook" ]] || continue
    name="$(basename "$hook")"
    ln -sf "$hook" "$hooks_dst/$name"
    echo "  linked hook: $hooks_dst/$name -> $hook"
  done
fi
"""

[tasks."install:hooks"]
description = "Symlink scripts/hooks/* into .git/hooks/ (runs automatically via mise run install)"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
hooks_src="$REPO_DIR/scripts/hooks"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
[[ -d "$hooks_src" && -d "$hooks_dst" ]] || { echo "hooks dirs not found"; exit 1; }
linked=0
for hook in "$hooks_src"/*; do
  [[ -f "$hook" ]] || continue
  name="$(basename "$hook")"
  ln -sf "$hook" "$hooks_dst/$name"
  echo "  linked: $hooks_dst/$name -> $hook"
  linked=$((linked+1))
done
echo "Installed $linked git hooks."
"""

[tasks."uninstall:hooks"]
description = "Remove git hooks installed from scripts/hooks/"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
hooks_src="$REPO_DIR/scripts/hooks"
removed=0
for hook in "$hooks_src"/*; do
  [[ -f "$hook" ]] || continue
  name="$(basename "$hook")"
  link="$hooks_dst/$name"
  [[ -L "$link" ]] || continue
  target="$(readlink "$link")"
  [[ "$target" == "$hook" ]] || continue
  rm "$link"
  echo "  removed: $link"
  removed=$((removed+1))
done
echo "Removed $removed git hooks."
"""

[tasks.uninstall]
description = "Remove sgt-* symlinks from ~/.local/bin"
run = """
#!/usr/bin/env bash
set -euo pipefail

TARGET_DIR="${SGT_INSTALL_DIR:-$HOME/.local/bin}"
removed=0

for f in "$TARGET_DIR"/sgt-* "$TARGET_DIR"/_sgt-*.sh "$TARGET_DIR/wiki-daily-digest"; do
  [[ -L "$f" ]] || continue
  # Only remove if it points back into the sergeant repo
  target="$(readlink "$f")"
  if [[ "$target" == *"/sergeant/bin/"* ]]; then
    rm "$f"
    echo "  removed: $f"
    removed=$((removed+1))
  fi
done

echo ""
echo "Removed $removed symlinks from $TARGET_DIR"
"""

[tasks.check]
description = "Verify required and optional dependencies are installed"
run = """
#!/usr/bin/env bash

source "${MISE_PROJECT_ROOT:-.}/bin/_sgt-bash-version.sh"
_sgt_require_running_bash || exit 1
source "${MISE_PROJECT_ROOT:-.}/bin/_sgt-lib.sh"

ok=true

_check() {
  local name="$1" cmd="$2" required="$3" hint="$4" ver_flag="${5:---version}"
  if command -v "$cmd" &>/dev/null; then
    version="$("$cmd" "$ver_flag" 2>&1 | head -1 | tr -d '\n')"
    printf "  %-14s  ✓  %s\\n" "$name" "$version"
  else
    if [[ "$required" == "required" ]]; then
      printf "  %-14s  ✗  MISSING — %s\\n" "$name" "$hint"
      ok=false
    else
      printf "  %-14s  -  not installed (optional) — %s\\n" "$name" "$hint"
    fi
  fi
}

_check_td() {
  local td_path td_version create_help
  if ! td_path="$(command -v td 2>/dev/null)"; then
    printf "  %-14s  ✗  MISSING — install Marcus td from github.com/marcus/td\\n" "td"
    ok=false
    return
  fi

  td_version="$(td --version 2>&1 || true)"
  [[ -n "$td_version" ]] || td_version="version unknown"
  create_help="$(td create --help 2>&1 || true)"

  if _sgt_td_supported_version_output "$td_version" && \
     [[ "$create_help" == *"--description"* ]] && \
     [[ "$create_help" == *"--json"* ]] && \
     [[ "$create_help" == *"--work-dir"* ]]; then
    printf "  %-14s  ✓  %s\\n" "td" "$(printf '%s' "$td_version" | head -1 | tr -d '\n')"
  else
    printf "  %-14s  ✗  Unsupported — require Marcus td with create/json/work-dir support\\n" "td"
    ok=false
  fi
}

_check_agent_harness() {
  local harness harness_path version

  for harness in opencode goose claude; do
    if harness_path="$(command -v "$harness" 2>/dev/null)"; then
      version="$("$harness" --version 2>&1 | head -1 | tr -d '\n')"
      [[ -n "$version" ]] || version="$harness_path"
      printf "  %-14s  ✓  %s\\n" "agent" "$harness: $version"
      return
    fi
  done

  printf "  %-14s  ✗  MISSING — install OpenCode, Goose, or Claude for interactive worker dispatch\\n" "agent"
  ok=false
}

echo "=== sergeant dependency check ==="
echo ""
echo "Required:"
printf "  %-14s  ✓  %s\\n" "Bash" "${BASH_VERSION} (minimum 3.2)"
_check "yq"         yq         required  "brew install yq"
_check "Python"     python3     required  "install Python 3"
_check "git"        git        required  "install Xcode command line tools"
_check "gh"         gh         required  "brew install gh"
_check "tmux"       tmux       required  "brew install tmux"                          "-V"
_check "lsof"       lsof       required  "install lsof with your system package manager" "-v"
_check_td
_check_agent_harness

echo ""
echo "Optional:"
_check "treehouse"  treehouse  optional  "https://github.com/kunchenguid/treehouse"
_check "graphify"   graphify   optional  "https://github.com/kunchenguid/graphify"
_check "no-mistakes" no-mistakes optional "install no-mistakes for final shipping validation"
_check "mise"       mise       optional  "brew install mise"

echo ""
if $ok; then
  echo "All required dependencies present."
else
  echo "Install missing required dependencies before using sergeant."
  exit 1
fi
"""

[tasks."test:docker:drain"]
description = "Run the drain test suite in Docker (system Bash + Bash 3.2 passes)"
run = """
#!/usr/bin/env bash
# Runs the drain test suite in two Docker passes:
#
#   Pass 1 — Debian bookworm-slim (system Bash 5.x)
#     Tests drain state helpers, sgt-drain --status (bug #82), drain lock
#     functions (bug #81), and sgt-recover drain gating.
#
#   Pass 2 — bash:3.2 Alpine image
#     Re-runs the same tests under Bash 3.2 to confirm Bash 3.2 compatibility.
#
# Prerequisites: Docker must be available.  The test image is built locally and
# not pushed; the bash:3.2 image is pulled from Docker Hub on first use.

set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"

SGT_BASH32_IMAGE="docker.io/library/bash:3.2@sha256:3a13e5da38baa575985778cd09ce8ac736d4b4dafc91a430e71271f6e5311b89"

pass=0
fail=0

_docker_pass() {
  local label="$1" image="$2" cmd="$3"
  printf '\\n══ %s ══\\n' "$label"
  if docker run --rm -v "${REPO_DIR}:/repo:ro" "$image" sh -c "$cmd"; then
    printf '\\n✓  %s passed\\n' "$label"
    pass=$((pass + 1))
  else
    printf '\\n✗  %s FAILED\\n' "$label" >&2
    fail=$((fail + 1))
  fi
}

# Build the Debian test image (cached after first build).
printf 'Building sergeant-test image...\\n'
docker build -q -f "${REPO_DIR}/Dockerfile.test" -t sergeant-test "${REPO_DIR}"
printf 'Built.\\n'

# Pass 1: system Bash (Debian bookworm-slim).
_docker_pass "System Bash (Debian bookworm-slim)" \
  sergeant-test \
  "BASH32='' bash /repo/tests/run-drain-tests.sh"

# Pass 2: Bash 3.2 (official Alpine image).
# Sets BASH32 to the Alpine Bash binary path and SGT_MINIMUM_BASH for the
# runtime-bash-test compatibility check.
_docker_pass "Bash 3.2 (Alpine)" \
  "$SGT_BASH32_IMAGE" \
  "BASH32=/usr/local/bin/bash SGT_MINIMUM_BASH=/usr/local/bin/bash bash /repo/tests/run-drain-tests.sh"

printf '\\n═══════════════════════════════════════════════════════════\\n'
printf ' Docker drain suite: %d passed, %d failed\\n' "$pass" "$fail"
printf '═══════════════════════════════════════════════════════════\\n'
[[ $fail -eq 0 ]]
"""

[tasks.update]
description = "Pull latest changes from origin and reinstall symlinks"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
echo "Pulling latest sergeant ..."
git -C "$REPO_DIR" pull --ff-only
echo ""
echo "Reinstalling ..."
mise run install
"""

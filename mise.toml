[tools]
# Sergeant supports Bash 3.2+ and uses Python 3 for bounded JSON/state handling.

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Symlink wiki-daily-digest into ~/.local/bin and build the sergeant binary"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO_DIR="$(cd "$(dirname "$MISE_ORIGINAL_CWD")" && pwd)/$(basename "$MISE_ORIGINAL_CWD")"
# Resolve to actual repo root regardless of where mise is invoked from
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
BIN_DIR="$REPO_DIR/bin"
TARGET_DIR="${SGT_INSTALL_DIR:-$HOME/.local/bin}"

mkdir -p "$TARGET_DIR"

linked=0
for f in "$BIN_DIR/wiki-daily-digest"; do
  [[ -f "$f" ]] || continue
  name="$(basename "$f")"
  ln -sf "$f" "$TARGET_DIR/$name"
  echo "  linked: $TARGET_DIR/$name -> $f"
  linked=$((linked+1))
done

# Remove legacy oc-inject links that may still exist from earlier Sergeant
# checkouts. oc-inject was deleted in August 2026 (GH #179). The file no
# longer ships in bin/ so any remaining symlinks are stale.
for deprecated_link in "$TARGET_DIR/oc-inject" "$HOME/.config/opencode/plugins/oc-inject.js"; do
  [[ -L "$deprecated_link" ]] || continue
  rm "$deprecated_link"
  echo "  removed stale oc-inject link: $deprecated_link"
done

echo ""
echo "Installed $linked scripts to $TARGET_DIR"

# Build the Go engine/MCP binary if Go is available
if command -v go &>/dev/null; then
  echo ""
  echo "Building sergeant (native v2 engine + MCP)..."
  (cd "$REPO_DIR" && go build -ldflags="-s -w" -o bin/sergeant ./cmd/sergeant/) && \
    echo "  built: $REPO_DIR/bin/sergeant" || \
    echo "  WARNING: go build failed — sergeant not available"
else
  echo ""
  echo "NOTE: go not found — skipping sergeant build. Install Go 1.21+ and run 'mise run build'."
fi

# Check PATH
if ! echo "$PATH" | tr ':' '\\n' | grep -qxF "$TARGET_DIR"; then
  echo ""
  echo "WARNING: $TARGET_DIR is not on your PATH."
  echo "Add this to your shell config (~/.zshrc or ~/.bashrc):"
  echo "  export PATH=\"$TARGET_DIR:\\$PATH\""
fi

# Install git hooks from scripts/hooks/ into .git/hooks/
hooks_src="$REPO_DIR/scripts/hooks"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
if [[ -d "$hooks_src" && -d "$hooks_dst" ]]; then
  for hook in "$hooks_src"/*; do
    [[ -f "$hook" ]] || continue
    name="$(basename "$hook")"
    ln -sf "$hook" "$hooks_dst/$name"
    echo "  linked hook: $hooks_dst/$name -> $hook"
  done
fi
"""

[tasks."install:hooks"]
description = "Symlink scripts/hooks/* into .git/hooks/ (runs automatically via mise run install)"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
hooks_src="$REPO_DIR/scripts/hooks"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
[[ -d "$hooks_src" && -d "$hooks_dst" ]] || { echo "hooks dirs not found"; exit 1; }
linked=0
for hook in "$hooks_src"/*; do
  [[ -f "$hook" ]] || continue
  name="$(basename "$hook")"
  ln -sf "$hook" "$hooks_dst/$name"
  echo "  linked: $hooks_dst/$name -> $hook"
  linked=$((linked+1))
done
echo "Installed $linked git hooks."
"""

[tasks."uninstall:hooks"]
description = "Remove git hooks installed from scripts/hooks/"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
hooks_src="$REPO_DIR/scripts/hooks"
removed=0
for hook in "$hooks_src"/*; do
  [[ -f "$hook" ]] || continue
  name="$(basename "$hook")"
  link="$hooks_dst/$name"
  [[ -L "$link" ]] || continue
  target="$(readlink "$link")"
  [[ "$target" == "$hook" ]] || continue
  rm "$link"
  echo "  removed: $link"
  removed=$((removed+1))
done
echo "Removed $removed git hooks."
"""

[tasks.uninstall]
description = "Remove Sergeant symlinks from ~/.local/bin"
run = """
#!/usr/bin/env bash
set -euo pipefail

TARGET_DIR="${SGT_INSTALL_DIR:-$HOME/.local/bin}"
removed=0

for f in "$TARGET_DIR/wiki-daily-digest"; do
  [[ -L "$f" ]] || continue
  # Only remove if it points back into the sergeant repo
  target="$(readlink "$f")"
  if [[ "$target" == *"/sergeant/bin/"* ]]; then
    rm "$f"
    echo "  removed: $f"
    removed=$((removed+1))
  fi
done

echo ""
echo "Removed $removed symlinks from $TARGET_DIR"
"""

[tasks.check]
description = "Verify the prerequisites the v2 Go engine actually uses"
run = """
#!/usr/bin/env bash
# Everything below is derived from exec.Command call sites in internal/ and
# cmd/sergeant/. tmux is forbidden as a factory dependency (D7) and is not
# checked for here.
ok=true

_need() {
  local name="$1" cmd="$2" why="$3"
  if command -v "$cmd" &>/dev/null; then
    printf "  %-10s  ok   %s\\n" "$name" "$why"
  else
    printf "  %-10s  MISSING  %s\\n" "$name" "$why"
    ok=false
  fi
}

echo "v2 engine prerequisites:"
_need git      git      "worktrees, branches, commits"
_need bash     bash     "runs each configured quality gate"
_need openspec openspec "dispatch resolves to a change (O3)"
_need gh       gh       "opening a pull request"

harness=""
for h in opencode oc claude goose codex pi copilot; do
  if command -v "$h" &>/dev/null; then harness="$h"; break; fi
done
if [[ -n "$harness" ]]; then
  printf "  %-10s  ok   %s\\n" "agent" "$harness"
else
  printf "  %-10s  MISSING  %s\\n" "agent" "one of: opencode oc claude goose codex pi copilot"
  ok=false
fi

if [[ "$ok" == true ]]; then
  echo ""
  echo "All v2 prerequisites present."
else
  echo ""
  echo "Install the missing prerequisites before dispatching."
  exit 1
fi
"""

[tasks.update]
description = "Pull latest changes from origin and reinstall symlinks"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
echo "Pulling latest sergeant ..."
git -C "$REPO_DIR" pull --ff-only
echo ""
echo "Reinstalling ..."
mise run install
"""

[tasks.build]
description = "Build the sergeant Go binary for the current OS/arch"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
cd "$REPO_DIR"
if ! command -v go &>/dev/null; then
  echo "ERROR: go not found. Install Go 1.21+ to build sergeant."
  exit 1
fi
echo "Building sergeant (native v2 engine + MCP)..."
go build -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" \
  -o bin/sergeant ./cmd/sergeant/
echo "Built: bin/sergeant"
"""

[tasks."build:all"]
description = "Cross-compile sergeant for all supported platforms (darwin/linux x amd64/arm64)"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
cd "$REPO_DIR"
if ! command -v go &>/dev/null; then
  echo "ERROR: go not found. Install Go 1.21+ to build sergeant."
  exit 1
fi
VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
LDFLAGS="-s -w -X main.version=$VERSION"
mkdir -p dist/

targets=(
  "darwin/amd64"
  "darwin/arm64"
  "linux/amd64"
  "linux/arm64"
)

for target in "${targets[@]}"; do
  os="${target%/*}"
  arch="${target#*/}"
  out="dist/sergeant-${os}-${arch}"
  echo "Building $out..."
  GOOS="$os" GOARCH="$arch" go build -ldflags="$LDFLAGS" -o "$out" ./cmd/sergeant/
done

echo ""
echo "Built:"
ls -lh dist/sergeant-*
"""

[tasks."build:clean"]
description = "Remove built binaries (bin/sergeant and dist/)"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
rm -f "$REPO_DIR/bin/sergeant"
rm -rf "$REPO_DIR/dist/"
echo "Cleaned."
"""

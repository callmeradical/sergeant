version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sergeant
    main: ./cmd/sergeant/
    binary: sergeant
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: sergeant
    builds:
      - sergeant
    name_template: "sergeant-{{ .Os }}-{{ .Arch }}"
    format: binary

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: callmeradical
    name: sergeant
  name_template: "{{.Tag}}"
  draft: false

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
